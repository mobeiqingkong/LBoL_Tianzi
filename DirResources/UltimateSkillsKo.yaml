TianziUltA:
  Title: 기부
  Content: "무념무상의 경계"
  Description: |-
    {PlayerName}가 |천의무봉|을 1턴 얻습니다.
    체력을 5 회복합니다.
    {PlayerName}의 모든 부정적 효과를 제거합니다.

TianziUltB:
  Title: 채부
  Content: "천궁홍화의 검"
  Description: |-
    날씨를 하나 무작위로 발동합니다. 3턴 지속됩니다.
    대상에게 {Damage}의 피해를 줍니다.
    이번 전투에서 처음 사용할 때 {Value1}의 추가 피해를 줍니다.
