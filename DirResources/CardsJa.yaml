  Description: |-
    {Damage}ダメージを与える。

TianziKeystoneGuard:
  Name: 要石ガード
  Description: |-
    {Block}|ブロック|を得る。

TianziScarletSlash:
  Name: 緋想剣斬撃
  Description: |-
    {Damage}ダメージを与える。

TianziScarletGuard:
  Name: 緋想剣ガード
  Description: |-
    {Block}|ブロック|を得る。

TianziKeystoneTurret:
  Name: 要石浮遊砲
  Description: |-
    {Value1}|絶壁|を得る。
    敵全体に{Damage}ダメージを{Value2}回与える。

TianziMushin:
  Name: 無念無想
  Description: |-
    |占術|{Scry}。
    {Block}|ブロック|を得る。
    山札の一番上のカードを引く。使用するか|廃棄|するかを選べる。

TianziBodyAsShield:
  Name: 身を盾に
  Description: |-
    {Block}|ブロック|と{Value1}|絶壁|を得る。

TianziKeystoneMatrix:
  Name: 要石のマトリクス
  Description: |-
    {Block}|ブロック|を得る。
    次の{Value1}ターンの間、ターン開始時に{Block}|ブロック|を得る。

TianziHeavenStepGuard:
  Name: 桃枝の庇護
  Description: |-
    {Block}|ブロック|を得る。
    手札が奇数の場合、{Value1}|絶壁|を得る。
    手札が偶数の場合、カードを1枚引く。
  ExtraDescription1: |-
    {Block}|ブロック|を得る。
    手札が奇数の場合、{Value1}|絶壁|を得る。
    |d:手札が偶数の場合、カードを1枚引く。|
  ExtraDescription2: |-
    {Block}|ブロック|を得る。
    |d:手札が奇数の場合、{Value1}絶壁を得る。|
    手札が偶数の場合、カードを1枚引く。

TianziWeatherWatch:
  Name: 天気観測
  Description: |-
    {Block}|ブロック|を得る。
    次のターン|天気|を1つ発動する。{Value1}ターン持続。

TianziHeavenlyShower:
  Name: 天界の洗礼
  Description: |-
    カードを{Value1}枚引く。
    ライフを{Value2}回復する。

TianziScarletFlash:
  Name: 灼熱の気焔
  Description: |-
    {Damage}ダメージを与える。
    手札が奇数の場合、ダメージが{Value1}に上がる。
    手札が偶数の場合、{Mana}を得る。
  ExtraDescription1: |-
    {Damage}ダメージを与える。
    手札が奇数の場合、ダメージが{Value1}に上がる。
    |d:手札が偶数の場合、{Mana}を得る。|
  ExtraDescription2: |-
    {Damage}ダメージを与える。
    |d:手札が奇数の場合、ダメージが{Value1}に上がる。|
    手札が偶数の場合、{Mana}を得る。

TianziScarletCharge:
  Name: 緋想の剣・蓄力
  Description: |-
    カードを{Value2}枚引く。
    次の攻撃カードの1ヒットあたりのダメージが{Value1}増える。この効果はプレイヤーの通常ターン終了時に消える。

TianziSkyCleave:
  Name: 天穹斬
  Description: |-
    {Damage}ダメージを2回与える。
    |脱力|を{Value1}ターン与える。

TianziSkywardStrike:
  Name: 天地の圧
  Description: |-
    {Damage}ダメージを与える。
    このターン防御カードを使用するたび、{SelfName}のダメージが{Value1}増える。

TianziDoubleSlash:
  Name: 双斬
  Description: |-
    {Damage}ダメージを{Value1}回与える。
    |再斬|を1枚手札に加える。

TianziSecondSlash:
  Name: 再斬
  Description: |-
    {Damage}ダメージを与える。
    対象が|ブロック|か|バリア|を持っている場合、2倍のダメージを与える。

TianziTemperamentSword:
  Name: 気質の剣
  Description: |-
    |因果|：直前に使用したカードが攻撃なら|弱体|を{Value1}ターン与える；
    防御かスキルなら|脱力|を{Value1}ターン与える。
    {Damage}ダメージを与える。

TianziScarletFlameWheel:
  Name: 緋焔の射撃
  Description: |-
    {Damage}ダメージを与える。
    さらにランダムな敵に同じダメージを与える。

TianziWorldRevolve:
  Name: 天地回転
  Description: |-
    手札が奇数の場合、カードを{Value1}枚引く。
    手札が偶数の場合、捨て札からランダムなカード{Value1}枚を手札に加える。
  ExtraDescription1: |-
    手札が奇数の場合、カードを{Value1}枚引く。
    |d:手札が偶数の場合、捨て札からランダムなカード{Value1}枚を手札に加える。|
  ExtraDescription2: |-
    |d:手札が奇数の場合、カードを{Value1}枚引く。|
    手札が偶数の場合、捨て札からランダムなカード{Value1}枚を手札に加える。

TianziPeachNectar:
  Name: 桃の甘露
  Description: |-
    ライフを{Value1}回復する。
    {Value2}|絶壁|を得る。

TianziPeachReserve:
  Name: 仙桃備蓄
  Description: |-
    |ターン終了時|：{SelfName}が手札にある場合、2|絶壁|を得る。
    |ターン開始時|：{SelfName}が手札にある場合、前のターンに失った|絶壁|{Value1}につき{Value2}|ブロック|を得てカードを1枚引く。1ターンに最大2回発動。
  FlavorText: |-
    彼女は仙桃を小さく割いて袖にしまった。「道中でお腹が空いたら、ちょっとつまめるから」と。

TianziBlazingSword:
  Name: 気焔万丈の剣
  Description: |-
    |弱体|を{Value1}ターン与える。
    {Damage}ダメージを与える。
    支払ったマナ1につき攻撃回数が1増える。
    {PlayerName}に|天気|がない場合、|快晴|を1ターン得る。

TianziGrowingBraver:
  Name: 緋焔レーザー
  Description: |-
    {Damage}ダメージを与える。
    ブロックされていないダメージを与えた時、{Value1}|火力|を得る。

TianziMeteorPlunge:
  Name: 大気圏突入
  Description: |-
    敵全体に{Damage}ダメージを与える。
    さらに敵全体に、{PlayerName}の|絶壁|2倍のダメージを与える。

TianziQuakeWorld:
  Name: 一撃、乾坤を震わす
  Description: |-
    {Damage}ダメージを与える。
    {Mana}を得る。
    このターン{PlayerName}が他の攻撃カードを使用するたび、{SelfName}のコストが任意の色マナ1つ分減る。

TianziOverwhelming:
  Name: 摧枯拉朽
  Description: |-
    {Damage}ダメージを与える。
    このダメージが対象の|ブロック|か|バリア|を突破した場合、|弱体|を{Value1}ターン与える。

TianziDanceSword:
  Name: 環舞の剣
  Description: |-
    即座に{Mana1}を1消費する。
    {Damage}ダメージを与える。
    |脱力|を{Value1}ターン与える。
    次のターン{Mana}を得てカードを1枚引く；マナを消費できなかった場合はマナを得ない。

TianziLandLiquefy:
  Name: 大地液化
  Description: |-
    敵全体に{Damage}ダメージを与え、
    さらに|ブロック|と|バリア|を{Value1}失わせる。

TianziKeystoneStorm:
  Name: 天罰の石柱
  Description: |-
    敵全体に{Damage}ダメージを与え、|脱力|を1ターン与える。
    {Value1}|ブロック|を得る。手札が3枚以上なら{Value2}|ブロック|を追加で得る。

TianziScarletExecution:
  Name: 緋色狂想
  Description: |-
    {Damage}ダメージを与える。
    手札が奇数の場合、このターンの次の攻撃カードが2倍のダメージを与える。
    手札が偶数の場合、カードを3枚引く。
  ExtraDescription1: |-
    {Damage}ダメージを与える。
    手札が奇数の場合、このターンの次の攻撃カードが2倍のダメージを与える。
    |d:手札が偶数の場合、カードを3枚引く。|
  ExtraDescription2: |-
    {Damage}ダメージを与える。
    |d:手札が奇数の場合、このターンの次の攻撃カードが2倍のダメージを与える。|
    手札が偶数の場合、カードを3枚引く。

TianziHeavenDescent:
  Name: 天穹崩落
  Description: |-
    {Damage}ダメージを与える。
    |絶壁|を全て消費し、消費値の2倍のダメージを対象に与える。
    手札が奇数の場合、このダメージが{Value1}増える。
    手札が偶数の場合、消費した|絶壁|と同量の|バリア|を得る。
  ExtraDescription1: |-
    {Damage}ダメージを与える。
    |絶壁|を全て消費し、消費値の2倍のダメージを対象に与える。
    手札が奇数の場合、このダメージが{Value1}増える。
    |d:手札が偶数の場合、消費した絶壁と同量のバリアを得る。|
  ExtraDescription2: |-
    {Damage}ダメージを与える。
    |絶壁|を全て消費し、消費値の2倍のダメージを対象に与える。
    |d:手札が奇数の場合、このダメージが{Value1}増える。|
    手札が偶数の場合、消費した|絶壁|と同量の|バリア|を得る。

TianziKeystoneArmor:
  Name: 要石の鎧
  Description: |-
    {Block}|ブロック|と{Shield}|バリア|を得る。
    {SelfName}を使用するたび、得る|バリア|が{Value1}増える。

TianziClearSky:
  Name: 晴空万里
  Description: |-
    手札・山札・捨て札から最大{Value1}枚のカードを選び|廃棄|する。
    |廃棄|したカード1枚につき{Shield}|バリア|を得る。

TianziHeavenCanopy:
  Name: 有頂天穹
  Description: |-
    {Block}|ブロック|を得る。
    カードを{Value1}枚引く。

TianziHeavenlyFlight:
  Name: 天人翱翔
  Description: |-
    {Mana}を得る。
    カードを{Value1}枚引く。

TianziHeavenlyInstinct:
  Name: 天人の直感
  Description: |-
    手札が奇数の場合、{Mana}を得る。
    手札が偶数の場合、カードを{Value1}枚引く。
  ExtraDescription1: |-
    手札が奇数の場合、{Mana}を得る。
    |d:手札が偶数の場合、カードを{Value1}枚引く。|
  ExtraDescription2: |-
    |d:手札が奇数の場合、{Mana}を得る。|
    手札が偶数の場合、カードを{Value1}枚引く。

TianziHeavenlyRitual:
  Name: 天人の流儀
  Description: |-
    |占術|{Scry}。カードを1枚引く。
    攻撃カードを引いたなら|火力|を1得る；防御カードなら|霊力|を1得る；
    スキルカードならカードを{Value1}枚追加で引く；状態異常か厄災ならそれを|廃棄|する。

TianziHeavenlyWriting:
  Name: 天人落書
  Description: |-
    手札を1枚選び|廃棄|し、カードを{Value1}枚引く。
    |廃棄|したカードにより：攻撃ならランダムに|弱体|を1ターン与える；防御ならランダムに|脱力|を1ターン与える；
    スキルならカードを1枚追加で引く；能力なら{Value2}|庇護|を得る；厄災か状態異常なら|光明|を1枚手札に加える。

TianziWeatherMastery:
  Name: 無垢の土
  Description: |-
    手札を1枚捨てる。{Block}|ブロック|を得る。
    捨て札から最大1枚を選び山札の上に置く。
    手札の枚数が{Value1}より多い場合、{Mana}を追加で得る。

TianziScarletRadiance:
  Name: 緋想の威光
  Description: |-
    カードが|廃棄|されるたび、敵全体に{Value1}の攻撃ダメージを与える。

TianziScarletWave:
  Name: 緋想剣斬波
  Description: |-
    毎ターン最初の{Value1}回、攻撃でダメージを与えた時、同量の|ブロック|を得る。
    この能力は重複しない。

TianziOddEvenQi:
  Name: 天人の気質
  Description: |-
    |奇数・偶数|を持つカードを使用した時、奇数・偶数の効果は{PlayerName}が選んで発動するようになる。

TianziPeachBoost:
  Name: 仙桃増幅
  Description: |-
    |絶壁|を得る時、追加で1得る。
    即座に{Value1}|絶壁|を得る。
    この能力は重複しない。

TianziPeachGarden:
  Name: 桃源郷
  Description: |-
    |絶壁|が減少した時、|絶壁|を1得る。

TianziPureWish:
  Name: 清霖の願い
  Description: |-
    毎ターン最初の{Value1}回、厄災か状態異常カードを引いた時、それを|廃棄|してカードを1枚引く；|庇護|が発動した時もこの効果は発動する。
    この能力は重複しない。

TianziHeavenShield:
  Name: 天界の庇護
  Description: |-
    {PlayerName}のターン開始時に{Mana}を得る。
    {PlayerName}のターン終了時に|庇護|を1得る。
    この能力は重複しない。

TianziMeditation:
  Name: 一念
  Description: |-
    毎ターンカードを1枚多く引く。
    ターン開始時、手札1枚と捨て札1枚を入れ替えられる。

TianziEndurance:
  Name: 天人の耐性
  Description: |-
    ターン開始時に|ブロック|を10得て、
    |霊力|を1得る（最大3まで）。

TianziPeachBlossom:
  Name: 因果掌握
  Description: |-
    |因果|を持つカードを使用した時、因果の効果は{PlayerName}が選んで発動するようになる。

TianziHeavenlyTempo:
  Name: 天人は俗に落ちず
  Description: |-
    {PlayerName}のターン開始時、奇数ターンは|火力|を{Value1}得る；
    偶数ターンは現在の|火力|の{Value2}倍の|ブロック|を得る（最大25）。
  UpgradedDescription: |-
    {PlayerName}のターン開始時、奇数ターンは|火力|を{Value1}得る；
    偶数ターンは現在の|火力|の{Value2}倍の|ブロック|を得る（最大25）。
    複数回使用した場合、火力の獲得量が重複する。

TianziFinalBlade:
  Name: 終絶の一剣
  Description: |-
    {Damage}ダメージを与える。
    その敵がライフを6%失うごとに、{SelfName}はその敵の最大ライフの{Value1}%のダメージを追加で与える。

TianziHardshipFirst:
  Name: 先憂後楽の剣
  Description: |-
    {Damage}ダメージを与える。
    手札が奇数の場合、使用後に{SelfName}を山札の上に置く。
    手札が偶数の場合、このターン終了まで手札を全て保留する。
  ExtraDescription1: |-
    {Damage}ダメージを与える。
    手札が奇数の場合、使用後に{SelfName}を山札の上に置く。
    |d:手札が偶数の場合、このターン終了まで手札を全て保留する。|
  ExtraDescription2: |-
    {Damage}ダメージを与える。
    |d:手札が奇数の場合、使用後に{SelfName}を山札の上に置く。|
    手札が偶数の場合、このターン終了まで手札を全て保留する。
  FlavorText: |-
    天下の憂いに先んじて憂い、天下の楽しみに後れて楽しむ——その理屈は彼女の頭に染みついていた。

TianziUnthinkableBlade:
  Name: 非想「非想非非想の剣」
  Description: |-
    {Damage}ダメージを与える。
    次のターン|天気|を1つランダムに発動する。{Value1}ターン持続。
    {PlayerName}のターンを終了し、追加ターンを行う。
    |時間制限|{Mana}。
  FlavorText: |-
    あの一振りに名はない。思いつかない時点で、名前などどうでもよくなるからだ。

TianziPureDawn:
  Name: 恒浄の黎
  Description: |-
    {Damage}ダメージを与える。
    {PlayerName}のデバフを全て除去し、
    与えたダメージの半分の|自然治癒|を得る。
  FlavorText: |-
    夜明けは一点の雑念もなく晴れていた。誰かが空全体を洗い流したみたいに。

TianziWorldCleaver:
  Name: 乾坤一擲
  Description: |-
    マナを全て消費する（X）。消費したマナと同数の手札を捨てる。
    1枚捨てるごとに1回発動：攻撃なら|火力|を1得る；防御なら|霊力|を1得る；
    スキルなら{Mana}を得る；能力・厄災・状態異常ならこのカードを|廃棄|し、捨て札からランダムな厄災か状態異常を1枚追加で|廃棄|する。
    捨てられる手札を超えたマナ分の{Mana2}を返還する。その後、同数のカードを引く。

TianziScarletApocalypse:
  Name: 気符「天啓気象の剣」
  Description: |-
    {Damage}ダメージを与える。
    次のターン|天気|を1つランダムに発動する。{Value1}ターン持続。
    {SelfName}の使用時に既に|天気|がある場合、1.5倍のダメージを与える。

TianziFinalJudgement:
  Name: 極彩輻光
  Description: |-
    {PlayerName}が自分のターン内に{Mana}を得た時、敵全体にその最大ライフの1%のダメージを与える。
    |活力|を1枚手札に加える。
  UpgradedDescription: |-
    {PlayerName}が自分のターン内に{Mana}を得た時、敵全体にその最大ライフの1%のダメージを与える。
    |幻虹|を1枚手札に加える。

TianziHeavenCreation:
  Name: 天界の造物
  Description: |-
    ランダムな{PlayerName}のレアカード{Value1}枚から1枚を選び手札に加える。
    コストは0で、|廃棄|と|虚無|を持つ。

TianziRainbowAura:
  Name: 虹彩の気息
  Description: |-
    {PlayerName}の基本マナの色ごとに、それぞれ2マナを得る。

TianziHeavenRoam:
  Name: 天界漫遊
  Description: |-
    手札を1枚選び|廃棄|し、カードを1枚引く。
    {PlayerName}がカードを{Value1}枚使用するたび、{SelfName}は捨て札から手札に戻る。
    |初見|：|光明|を1枚手札に加える。

TianziHeavenMirror:
  Name: 天界の鏡
  Description: |-
    このターンに最後に使用したカードのコピーを1枚手札に加える。
    コストは0で、|廃棄|を持つ。

TianziPeachTalisman:
  Name: 桃符「金城鉄壁の仙桃」
  Description: |-
    |天衣無縫|を1ターンと{Value1}|絶壁|を得る。
    4自然ターンごとに|天衣無縫|を1得る。
  FlavorText: |-
    桃符は鴨居に貼られた。天狗の団扇でも叩き落とせない。

TianziMortalJourney:
  Name: 凡間の遊び
  Description: |-
    {PlayerName}がカードを{Value1}枚使用するたび、{Mana}を得てカードを1枚引く。
    この能力は重複しない。
  FlavorText: |-
    人間界に下りた彼女は、凡人のリズムを覚えた。少し歩いて、少し休む。

TianziHeavenThrone:
  Name: 有頂天の恩寵
  Description: |-
    ターン開始時に|ブロック|を失った時、残った|ブロック|を|絶壁|に変換する。
    毎ターン開始時に{Mana}を得る。

TianziPeachEternity:
  Name: 「野生の桃ミルク」
  Description: |-
    {PlayerName}の|絶壁|上限が{Value1}上がる。
    {PlayerName}は毎ターン開始時に{Value2}|絶壁|を得る。
  FlavorText: |-
    パッケージにはこう書いてある。賞味期限：永遠。

TianziParityOddChoice:
  Name: 奇数
  Description: |-
    奇数効果を発動する。

TianziParityEvenChoice:
  Name: 偶数
  Description: |-
    偶数効果を発動する。

TianziPlayChoice:
  Name: 使用
  Description: |-
    このカードを使用する。

TianziExileChoice:
  Name: 廃棄
  Description: |-
    このカードを|廃棄|する。

TianziKarmaAttackChoice:
  Name: 攻撃
  Description: |-
    攻撃の|因果|を発動する。

TianziKarmaDefenseChoice:
  Name: 防御
  Description: |-
    防御の|因果|を発動する。

TianziKarmaSkillChoice:
  Name: スキル
  Description: |-
    スキルの|因果|を発動する。

TianziKarmaAbilityChoice:
  Name: 能力
  Description: |-
    能力の|因果|を発動する。

TianziKarmaCurseChoice:
  Name: 厄災
  Description: |-
    厄災か状態異常の|因果|を発動する。

TianziIkuFriend:
  Name: 竜宮の使い衣玖
  Description: |-
    {FriendP}|占術|{Scry}。自分のターン開始まで{Value2}|帯電|を得る。
  ExtraDescription1: |-
    {FriendA}|天衣無縫|を1ターン得る。

TianziShrugIgnore:
  Name: 肩すくめ無視
  Description: |-
    {Block}|ブロック|を得る。
    このターン、{PlayerName}がダメージを受けた時|ブロック|を1得る。この効果は重複せず、ターン終了時に消える。

TianziBlueMeditation:
  Name: 瞑想
  Description: |-
    |水沫|を1枚手札に加える。
    手札が奇数の場合、カードを1枚引く。
    手札が偶数の場合、手札を1枚選び|廃棄|する。
  ExtraDescription1: |-
    |水沫|を1枚手札に加える。
    手札が奇数の場合、カードを1枚引く。
    |d:手札が偶数の場合、手札を1枚選び廃棄する。|
  ExtraDescription2: |-
    |水沫|を1枚手札に加える。
    |d:手札が奇数の場合、カードを1枚引く。|
    手札が偶数の場合、手札を1枚選び|廃棄|する。

TianziTemperamentProbe:
  Name: 気質探査
  Description: |-
    {PlayerName}はターン内に|奇数・偶数|を持つカードを使用するたび、カードを1枚引く。

TianziEarthStone:
  Name: 霊想「大地を鎮める石」
  Description: |-
    手札に加わった時、{SelfName}を|廃棄|する。
    |鎮石|を{Value1}得る。

TianziFeast:
  Name: 祝宴
  Description: |-
    敵を倒すたび、ライフを2回復し、{Mana}を得てカードを1枚引く。

TianziPeachMake:
  Name: 仙桃製成
  Description: |-
    |絶壁|を3失う。|絶壁|がない場合は発動しない。
    ライフを2回復し、<sprite="Point" name="Power">を2得て、{Mana}を得て、カードを{Value1}枚引く。

TianziDomainDuel:
  Name: 境界対決
  Description: |-
    次に受ける敵の攻撃ダメージを完全に防ぎ、そのダメージをそのまま返す。

TianziHeavenDoor:
  Name: 天界の扉
  Description: |-
    手札を1枚選び|アップグレード|し、{Value1}|絶壁|を得る。
    |アップグレード|したカードにより：
    攻撃ならそのコピーを手札に加える。コストは0で、|廃棄|と|虚無|を持つ；
    防御なら{Value2}|ブロック|を得る；
    スキルならカードを2枚引く。

TianziAyaNewsSp:
  Name: 文々。新聞　『比那名居天子』特集
  Description: |-
    |ターン終了時|：|霊力|を{Value1}失う。
  FlavorText: |-
    月都万象展特集！{PlayerName}に関する噂話を詳細に掲載。

TianziKarmaShackle:
  Name: 因果の枷
  Description: |-
    このカードに隣り合う手札を使用した時、反対側の隣のカードが|禁止|を得る；この効果で付与された|禁止|はターン終了時に除去される。
  PreventUsageMessage: |-
    因果の枷が隣接するカードを制限している。
  FlavorText: |-
    何もないところから生まれた枷もまた、「因果」がもたらす必然にほかならない。太古最強の狩人もいつか化石となるように、それはとうに定められていた……
