TianziKeystoneShot:
  Name: 要石电击
  Description: 造成 {Damage} 点伤害。

TianziKeystoneGuard:
  Name: 要石护盾
  Description: 获得 {Block} 点|格挡|。

TianziScarletSlash:
  Name: 绯想剑斩击
  Description: 造成 {Damage} 点伤害。

TianziScarletGuard:
  Name: 绯想剑格挡
  Description: 获得 {Block} 点|格挡|。

TianziKeystoneTurret:
  Name: 要石浮游炮
  Description: 对所有敌人造成 {Damage} 点伤害 {Value1} 次。

TianziMushin:
  Name: 无念无想
  Description: |-
    获得 {Block} 点|格挡|。
    从抽牌堆随机打出一张防御牌。

TianziBodyAsShield:
  Name: 以身为盾
  Description: 获得 {Block} 点|格挡|和 {Value1} 点|临命|。

TianziKeystoneMatrix:
  Name: 要石矩阵
  Description: |-
    获得 {Block} 点|格挡|。
    接下来 {Value1} 回合内，回合开始时获得 {Block} 点|格挡|。

TianziHeavenStepGuard:
  Name: 桃枝庇护
  Description: |-
    获得 {Block} 点|格挡|。
    手牌张数为奇数时，获得 {Value1} 点|临命|。
    手牌张数为偶数时，抽 1 张牌。
TianziWeatherWatch:
  Name: 天气观测
  Description: |-
    获得 {Block} 点|格挡|。
    下回合释放一种天气，持续 {Value1} 回合。

TianziHeavenlyShower:
  Name: 天界之洗礼
  Description: |-
    抽 {Value1} 张牌。
    恢复 {Value2} 点生命值。

TianziScarletFlash:
  Name: 灼热气焰
  Description: |-
    造成 {Damage} 点伤害。
    手牌张数为奇数时，伤害提升至 {Value1} 点。
    手牌张数为偶数时，获得 1 点红色法力。

TianziScarletCharge:
  Name: 绯想之剑充能
  Description: |-
    造成 {Damage} 点伤害。
    下一张攻击牌的伤害增加 {Value1} 点。

TianziSkyCleave:
  Name: 天穹斩
  Description: |-
    造成 {Damage} 点伤害 2 次。
    施加 {Value1} 回合|虚弱|。

TianziSkywardStrike:
  Name: 天地之压
  Description: |-
    造成 {Damage} 点伤害。
    本回合每打出一张防御牌，此牌伤害提高 {Value1} 点。
TianziDoubleSlash:
  Name: 双斩
  Description: |-
    造成 {Damage} 点伤害 {Value1} 次。
    将一张「再斩」置入手中。

TianziSecondSlash:
  Name: 再斩
  Description: |-
    造成 {Damage} 点伤害。
    若目标拥有|格挡|或|护盾|，伤害翻倍。

TianziTemperamentSword:
  Name: 气质之剑
  Description: |-
    造成 {Damage} 点伤害。
    上一张打出的牌为攻击牌则施加 {Value1} 回合|易伤|；
    为防御或技能牌则施加 {Value1} 回合|虚弱|。

TianziScarletFlameWheel:
  Name: 绯焰射击
  Description: |-
    造成 {Damage} 点伤害。
    再对随机的敌人造成同样的伤害。

TianziWorldRevolve:
  Name: 天地回转
  Description: |-
    手牌张数为奇数时，抽 {Value1} 张牌；
    为偶数时，将弃牌堆的 {Value1} 张随机牌置入手中。

TianziPeachNectar:
  Name: 桃之甘露
  Description: |-
    恢复 {Value1} 点生命值。
    获得 {Value2} 点|临命|。

TianziPeachReserve:
  Name: 仙桃储备
  Description: |-
    获得「|桃储|」：每回合结束时获得 2 点|临命|；
    每当累计减少 {Value3} 点|临命|，获得 {Value2} 点|格挡|并抽 1 张牌，
    每回合最多触发 2 次。
  FlavorText: 她把仙桃掰成小块收进袖子里，说是路上万一饿了可以垫一垫。

TianziBlazingSword:
  Name: 气焰万丈之剑
  Description: |-
    造成 {Damage} 点伤害 1 次；
    每额外支付 1 点费用，攻击段数 +1。
    施加 {Value1} 回合|易伤|。

TianziGrowingBraver:
  Name: 绯焰镭射
  Description: |-
    若任一敌人的意图为攻击，获得 {Value1} 点|火力|。
    造成 {Damage} 点伤害。

TianziMeteorPlunge:
  Name: 坠入大气圈
  Description: |-
    对所有敌人造成 {Damage} 点伤害。
    再对所有敌人造成一次等同于{PlayerName}|临命| ×2 的伤害。

TianziQuakeWorld:
  Name: 一击震乾坤
  Description: |-
    造成 {Damage} 点伤害，获得 1 点红色法力。
    本回合每打出过一张其他攻击牌，此牌伤害提高 {Value1} 点。

TianziOverwhelming:
  Name: 摧枯拉朽
  Description: |-
    造成 {Damage} 点伤害。
    若此伤害突破了目标的|格挡|或|护盾|，施加 {Value1} 回合|易伤|。

TianziDanceSword:
  Name: 环舞之剑
  Description: |-
    造成 {Damage} 点伤害，施加 {Value1} 回合|虚弱|。
    下回合获得 {Value2} 点白色法力，抽 1 张牌。

TianziLandLiquefy:
  Name: 大地液化
  Description: |-
    对所有敌人造成 {Damage} 点伤害，
    并使其失去 {Value1} 点|格挡|和|护盾|。

TianziKeystoneStorm:
  Name: 天罚的石柱
  Description: |-
    对所有敌人造成 {Damage} 点伤害，并施加 1 回合|虚弱|。
    获得 {Value1} 点|格挡|。若手牌数不少于 3，额外获得 {Value2} 点|格挡|。
TianziScarletExecution:
  Name: 绯色狂想
  Description: |-
    造成 {Damage} 点伤害。
    若此伤害击杀了目标，获得 {Value1} p点。

TianziHeavenDescent:
  Name: 天穹崩落
  Description: |-
    获得 1 回合|天衣无缝|。
    造成 {Damage} 点伤害。

TianziKeystoneArmor:
  Name: 要石覆体
  Description: |-
    获得 {Block} 点|格挡|和 {Shield} 点|护盾|。
    若本回合已打出过其他防御牌，|护盾|额外 +{Value1}。

TianziClearSky:
  Name: 晴空万里
  Description: |-
    从手牌、抽牌堆和弃牌堆中，选择至多 {Value1} 张牌放逐。
    每放逐一张牌，获得 {Shield} 点|护盾|。

TianziHeavenCanopy:
  Name: 有顶天穹
  Description: |-
    获得 {Block} 点|格挡|。
    抽 {Value1} 张牌。

TianziHeavenlyFlight:
  Name: 天人的飞翔
  Description: |-
    获得 {Mana} 点彩色费用。
    抽 {Value1} 张牌。

TianziHeavenlyInstinct:
  Name: 天人的直觉
  Description: |-
    手牌张数为奇数时，获得 {Mana} 点费用；
    为偶数时，抽 {Value1} 张牌。

TianziHeavenlyRitual:
  Name: 天人的流仪
  Description: |-
    占卜 {Scry}，抽 1 张牌。
    抽到攻击牌则获得 1 点|火力|；防御牌则获得 1 点|灵力|；
    技能牌则额外抽 {Value1} 张。

TianziHeavenlyWriting:
  Name: 天人落书
  Description: |-
    选择一张手牌放逐，抽 {Value1} 张牌。
    根据放逐牌种类：攻击或防御随机施加 1 回合|易伤| /
    技能额外抽 1 张 / 能力获得 {Value2} 层|庇护| / 诅咒或状态获得一张光芒。
TianziWeatherMastery:
  Name: 无垢之土
  Description: |-
    选择一张手牌丢弃。获得 {Block} 点|格挡|。
    选择弃牌堆内至多一张牌置于抽牌堆顶。
    若手牌数量大于 {Value1}，额外获得 1 点白色法力。
TianziScarletRadiance:
  Name: 绯想的威光
  Description: 获得「|威光|」：每当一张牌被放逐，对所有敌人造成 {Value1} 点攻击伤害。

TianziScarletWave:
  Name: 绯想剑斩波
  Description: 获得「|斩波|」：每回合首次造成攻击伤害时，获得等量的|格挡|。

TianziOddEvenQi:
  Name: 天人之气
  Description: 获得「|奇偶|」：手牌张数的奇偶分支改为由{PlayerName}选择触发。

TianziPeachBoost:
  Name: 仙桃增幅
  Description: |-
    获得「|桃增|」：获得|临命|时额外获得 1 点。
    立即获得 {Value1} 点|临命|。

TianziPeachGarden:
  Name: 漫漫桃园
  Description: 获得「|桃园|」：|临命|减少时，获得 1 点|临命|。

TianziPureWish:
  Name: 清霖之愿
  Description: 获得「|清霖|」：每回合前 {Value1} 次抽到诅咒或状态牌时，将其放逐并抽 1 张牌。

TianziHeavenShield:
  Name: 天界之庇护
  Description: 获得「|庇护|」：每回合结束时获得 1 层|庇护|，并在下回合获得 1 点白色法力。

TianziMeditation:
  Name: 一念
  Description: |-
    获得「|一念|」：每回合多抽 1 张牌；
    回合开始时，可将一张手牌与弃牌堆内的一张牌互换。
TianziEndurance:
  Name: 天人的耐性
  Description: |-
    获得「|耐性|」：回合开始时保留上回合至多 10 点|格挡|，
    并获得 1 点|灵力|（最多累计 3 点）。
TianziPeachBlossom:
  Name: 因果之剑
  Description: 获得「|因果选|」：带有|因果|关键字的牌打出时，因果效果改为自行选择触发。
TianziHeavenlyTempo:
  Name: 天人永不落俗
  Description: |-
    获得「|天人|」：每回合开始时，奇数回合获得 1 点|火力|；
    偶数回合获得等同于当前火力（升级后 1.5 倍）的|格挡|。
TianziFinalBlade:
  Name: 终绝的一剑
  Description: |-
    造成 {Damage} 点伤害。
    目标每失去 5% 生命值，此牌伤害提高 {Value1}%。
  FlavorText: 她把剑举过头顶的那一刻，天上的云停住了。

TianziHardshipFirst:
  Name: 先忧后乐之剑
  Description: |-
    造成 {Damage} 点伤害。
    手牌张数为奇数时，打出后置于抽牌堆顶；
    为偶数时，保留所有手牌一回合。
  FlavorText: 先天下之忧而忧，后天下之乐而乐——这道理她背得滚瓜烂熟。

TianziUnthinkableBlade:
  Name: 非想「非想非非想之剑」
  Description: |-
    造成 {Damage} 点伤害。
    随机释放一种天气，持续 {Value1} 回合。
    结束{PlayerName}的回合，开启一个额外的回合，并获得 1 点|时间有限|。
  FlavorText: 那一剑没有名字，因为想不出来的时候，名字也就无所谓了。

TianziPureDawn:
  Name: 恒净之黎
  Description: |-
    造成 {Damage} 点伤害。
    移除{PlayerName}身上的所有负面效果，
    并获得等同于造成伤害一半的|自愈|。
  FlavorText: 天亮得毫无杂念，像是有人把整个天空洗过一遍。

TianziWorldCleaver:
  Name: 乾坤一掷
  Description: |-
    从左到右丢弃 X 张手牌并抽等量的牌。
    根据丢弃牌的种类依次触发：攻击获得|火力| / 防御获得|灵力| /
    技能获得 2 点彩色费用 / 能力或诅咒与状态则放逐手牌与弃牌中的诅咒与状态。
    返还超出可弃手牌数量的费用。
TianziScarletApocalypse:
  Name: 气符「天启气象之剑」
  Description: |-
    造成 {Damage} 点伤害。随机释放一种天气，持续 {Value1} 回合。
    若打出时场上已有天气，此牌伤害提升 1.5 倍。
TianziFinalJudgement:
  Name: 纯粹致死
  Description: 获得「|致死|」：在自己的回合内获得无色法力时，对所有敌人造成其最大生命值 1% 的伤害。
TianziHeavenCreation:
  Name: 天界造物
  Description: |-
    从 {Value1} 张随机的主角角色牌中选择一张加入手中。
    它费用为 0，并具有|放逐|和|虚无|。
TianziHeavenRoam:
  Name: 天界漫游
  Description: |-
    选择一张手牌放逐，抽 1 张牌。
    你每打出 {Value1} 张牌，此牌就从弃牌堆回到手中。
    初见：获得一张光芒。
TianziHeavenMirror:
  Name: 天界之镜
  Description: |-
    将本回合上一张打出的牌的一张复制置入手中。
    该复制费用为 0 且具有|放逐|。
TianziPeachTalisman:
  Name: 桃符「固若金汤的仙桃」
  Description: |-
    获得「|桃符|」：每 4 个回合获得 1 回合|天衣无缝|，
    并立即获得 {Value1} 点|临命|。
  FlavorText: 桃符贴在门框上，连天狗的团扇都敲不开。

TianziMortalJourney:
  Name: 凡间之游
  Description: |-
    获得「|凡游|」：每打出 {Value1} 张牌，
    获得 1 点白色法力并抽 1 张牌。
  FlavorText: 下凡一趟，她学会了凡人的节奏：走几步，歇一歇。

TianziHeavenThrone:
  Name: 有顶天的恩宠
  Description: |-
    获得「|恩宠|」：回合结束时将失去的|格挡|转化为|临命|。
    每回合开始获得 1 点白色法力。
TianziPeachEternity:
  Name: “野生桃奶”
  Description: |-
    获得「|桃久|」：|临命|上限提高 {Value1}；
    每回合开始获得 2 点|临命|。
TianziParityOddChoice:
  Name: 奇数
  Description: 触发奇数分支。

TianziParityEvenChoice:
  Name: 偶数
  Description: 触发偶数分支。

TianziPlayChoice:
  Name: 打出
  Description: 打出这张防御牌。

TianziExileChoice:
  Name: 放逐
  Description: 放逐这张防御牌。

TianziKarmaAttackChoice:
  Name: 攻击
  Description: 触发攻击因果。

TianziKarmaDefenseChoice:
  Name: 防御
  Description: 触发防御因果。

TianziKarmaSkillChoice:
  Name: 技能
  Description: 触发技能因果。

TianziKarmaAbilityChoice:
  Name: 能力
  Description: 触发能力因果。

TianziKarmaCurseChoice:
  Name: 诅咒
  Description: 触发诅咒或状态因果。

TianziSplash:
  Name: 水花
  Description: 抽 1 张牌。（放逐 保留）

TianziIkuFriend:
  Name: 龙宫使者衣玖
  Description: |-
    被动：占卜 {Value1}，直到自己的回合开始之前获得 {Value2} 层|电击|。
    主动：获得 1 回合|天衣无缝|。

TianziShrugIgnore:
  Name: 耸肩无视
  Description: |-
    获得 {Block} 点|格挡|。
    当{PlayerName}在自己的回合内受到伤害时，获得 3 点|格挡|。此效果不可叠加。

TianziBlueMeditation:
  Name: 冥想
  Description: |-
    获得一张水花。
    手牌张数为奇数时，抽 1 张牌。
    手牌张数为偶数时，选择一张手牌放逐。

TianziTemperamentProbe:
  Name: 气质探查
  Description: {PlayerName}在回合内每打出一张|奇偶数|牌，抽 1 张牌。

TianziEarthStone:
  Name: 灵想「镇守大地之石」
  Description: |-
    进入手中时放逐此牌。后续 {Value1} 个回合获得 2 层|自愈|。

TianziFeast:
  Name: 庆功宴
  Description: 每当一名敌人被打败，恢复 2 点生命值，获得 1 点彩色费用，抽 1 张牌。

TianziPeachMake:
  Name: 仙桃制成
  Description: |-
    失去 3 点|临命|。若没有|临命|则不生效。
    恢复 2 点生命值，获得 2 点P点，获得 {Value1} 点彩色费用，抽 {Value1} 张牌。

TianziDomainDuel:
  Name: 境界对决
  Description: 完全抵挡下一次受到的敌人攻击伤害，并完整返还这一次伤害。

TianziHeavenDoor:
  Name: 天界之扉
  Description: |-
    选择一张手牌将其升级，获得 {Value1} 点|临命|。
    根据升级的牌为攻击 / 防御 / 技能：
    添加其复制（0费、放逐、虚无） / 获得 {Value2} 点|格挡| / 抽 2 张牌。
