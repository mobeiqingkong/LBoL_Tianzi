  Description: |-
    选择一张手牌将其|升级|，获得 {Value1} 点|绝壁|。
    根据|升级|的牌：攻击则将其复制加入手中，费用为 |e:0|，具有|放逐|、|虚无|；
    防御则获得 {Value2} 点|格挡|；技能则抽 |e:2| 张牌。

TianziKarmaShackle:
  Name: 因果枷锁
  Description: |-
    你只能打出一张与此牌相邻的手牌；打出其中一侧后，另一侧本回合内无法打出。
    |禁止| |虚无|
  PreventUsageMessage: 因果枷锁限制了可打出的相邻牌。
