  Description: 造成 {Damage} 点伤害。

TianziScarletGuard:
  Name: 绯想剑格挡
  Description: 获得 {Block} 点|格挡|。

TianziKeystoneTurret:
  Name: 要石浮游炮
  Description: 造成 {Damage} 点伤害 {Value1} 次。

TianziStoneVolley:
  Name: 飞石连投
  Description: 造成 {Damage} 点伤害 {Value1} 次。

TianziKeystoneBarrage:
