  Description: |-
    将一张|水花|加入手中。
    手牌张数为奇数时，抽 |e:1| 张牌。
    手牌张数为偶数时，选择一张手牌|放逐|。
  ExtraDescription1: |-
    将一张|水花|加入手中。
    手牌张数为奇数时，抽 |e:1| 张牌。
    |d:手牌张数为偶数时，选择一张手牌放逐。|
  ExtraDescription2: |-
    将一张|水花|加入手中。
    |d:手牌张数为奇数时，抽 1 张牌。|
    手牌张数为偶数时，选择一张手牌|放逐|。

TianziTemperamentProbe:
  Name: 气质探查
  Description: '{PlayerName}在回合内每打出一张具有|奇偶数|的牌，抽 |e:1| 张牌。'

TianziEarthStone:
  Name: 灵想「镇守大地之石」
  Description: |-
    进入手中时|放逐|{SelfName}。
    后续 {Value1} 个回合获得 |e:2| 层|自愈|。

TianziFeast:
