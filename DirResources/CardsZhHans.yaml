  Description: |-
    失去 |e:3| 点|绝壁|。若没有|绝壁|则不生效。
    恢复 |e:2| 点生命值，获得 |e:2| 点<sprite="Point" name="Power">，获得{Mana}，抽 {Value1} 张牌。

TianziDomainDuel:
