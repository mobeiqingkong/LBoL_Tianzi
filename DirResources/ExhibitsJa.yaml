TianziExhibitA:
  Name: 仙桃
  Description: |-
    基本法力{Mana}を提供する。|比那名居天子|専用カードをカードプールに追加する。
    各戦闘の最初のターン開始時、カードを1枚多く引き、{Mana2}を追加で獲得する。
    毎ターン終了時、<sprite="Point" name="Power">を1獲得する。
    {PlayerName}がHPに影響するダメージを受けるたび、{Value1}HP回復する（1戦闘につき最大7回）。
    この効果が7回発動した後は、毎ターン終了時に<sprite="Point" name="Power">を獲得しなくなる。
  FlavorText: |-
    有頂天の桃源郷で最初に実った果実。食べれば三千年寿命が延びるとか。天子はそれを懐にしまい、人間界へ持ち帰った。理由は「道中退屈だから、腹の足しになる」。
    「仙桃はもちろん大事な時に取っておくの！……大事な時って何？うーん、機嫌がいい時でしょ。」

TianziBossKeepsake:
  Name: 天子の記念品
  Description: |-
    第一章の天子を倒した後に残る形見。
    この記念品を持って第二章に進むと、ボス戦は必ず比那名居天子になる。
  FlavorText: |-
    「私の宝物を返しなさい！」

TianziExhibitB:
  Name: 緋想の剣
  Description: |-
    基本法力{Mana}を提供する。|比那名居天子|専用カードをカードプールに追加する。
    毎ターン最初に{PlayerName}が敵にデバフを付与した時、|脱力|を1ターン追加する。
    その敵が既に|脱力|なら、代わりに|弱体|を1ターン追加する。
  FlavorText: |-
    緋想天の天候と天子の気質から鍛え上げられた長剣。刃は無色なのに、持つ者の今の感情を必ず映し出す——だから彼女が不機嫌な時は、誰も彼女の前に立ちたがらない。
    「この剣は嘘をつかないよ。映るものは私の一番本当の姿——今なら、たぶん『ちょっと殴りたい』かな。」
