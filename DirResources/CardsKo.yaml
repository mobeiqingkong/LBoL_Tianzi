TianziKeystoneShot:
  Name: 요석 전격
  Description: |-
    피해를 {Damage} 줍니다.

TianziKeystoneGuard:
  Name: 요석 가드
  Description: |-
    |방어|를 {Block} 얻습니다.

TianziScarletSlash:
  Name: 비상검 참격
  Description: |-
    피해를 {Damage} 줍니다.

TianziScarletGuard:
  Name: 비상검 가드
  Description: |-
    |방어|를 {Block} 얻습니다.

TianziKeystoneTurret:
  Name: 요석 부유포
  Description: |-
    |절벽|을 {Value1} 얻습니다.
    모든 적에게 피해를 {Damage}씩 {Value2}번 줍니다.

TianziMushin:
  Name: 무념무상
  Description: |-
    |예지| {Scry}.
    |방어|를 {Block} 얻습니다.
    뽑을 카드 더미 맨 위의 카드를 뽑습니다. 사용하거나 |소멸|시킬 수 있습니다.

TianziBodyAsShield:
  Name: 몸을 방패로
  Description: |-
    |방어|를 {Block} 얻고 |절벽|을 {Value1} 얻습니다.

TianziKeystoneMatrix:
  Name: 요석 매트릭스
  Description: |-
    |방어|를 {Block} 얻습니다.
    다음 {Value1}턴 동안 턴 시작 시 |방어|를 {Block} 얻습니다.

TianziHeavenStepGuard:
  Name: 도지의 비호
  Description: |-
    |방어|를 {Block} 얻습니다.
    손패가 홀수라면 |절벽|을 {Value1} 얻습니다.
    손패가 짝수라면 카드를 1장 뽑습니다.
  ExtraDescription1: |-
    |방어|를 {Block} 얻습니다.
    손패가 홀수라면 |절벽|을 {Value1} 얻습니다.
    |d:손패가 짝수라면 카드를 1장 뽑습니다.|
  ExtraDescription2: |-
    |방어|를 {Block} 얻습니다.
    |d:손패가 홀수라면 절벽을 {Value1} 얻습니다.|
    손패가 짝수라면 카드를 1장 뽑습니다.

TianziWeatherWatch:
  Name: 날씨 관측
  Description: |-
    |방어|를 {Block} 얻습니다.
    다음 턴 |날씨|를 하나 발동합니다. {Value1}턴 지속됩니다.

TianziHeavenlyShower:
  Name: 천계의 세례
  Description: |-
    카드를 {Value1}장 뽑습니다.
    체력을 {Value2} 회복합니다.

TianziScarletFlash:
  Name: 작열의 화염
  Description: |-
    피해를 {Damage} 줍니다.
    손패가 홀수라면 피해가 {Value1}로 증가합니다.
    손패가 짝수라면 {Mana}를 얻습니다.
  ExtraDescription1: |-
    피해를 {Damage} 줍니다.
    손패가 홀수라면 피해가 {Value1}로 증가합니다.
    |d:손패가 짝수라면 {Mana}를 얻습니다.|
  ExtraDescription2: |-
    피해를 {Damage} 줍니다.
    |d:손패가 홀수라면 피해가 {Value1}로 증가합니다.|
    손패가 짝수라면 {Mana}를 얻습니다.

TianziScarletCharge:
  Name: 비상의 검・축력
  Description: |-
    카드를 {Value2}장 뽑습니다.
    다음 공격 카드의 1회 타격당 피해가 {Value1} 증가합니다. 이 효과는 플레이어의 일반 턴 종료 시 사라집니다.

TianziSkyCleave:
  Name: 천궁참
  Description: |-
    피해를 {Damage}씩 2번 줍니다.
    |허약|을 {Value1}턴 부여합니다.

TianziSkywardStrike:
  Name: 천지의 압박
  Description: |-
    피해를 {Damage} 줍니다.
    이번 턴 방어 카드를 사용할 때마다 {SelfName}의 피해가 {Value1} 증가합니다.

TianziDoubleSlash:
  Name: 쌍참
  Description: |-
    피해를 {Damage}씩 {Value1}번 줍니다.
    |재참|을 1장 손에 넣습니다.

TianziSecondSlash:
  Name: 재참
  Description: |-
    피해를 {Damage} 줍니다.
    대상이 |방어|나 |보호막|을 갖고 있다면 2배의 피해를 줍니다.

TianziTemperamentSword:
  Name: 기질의 검
  Description: |-
    |인과|: 직전에 사용한 카드가 공격이라면 |취약|을 {Value1}턴 부여하고;
    방어나 스킬이라면 |허약|을 {Value1}턴 부여합니다.
    피해를 {Damage} 줍니다.

TianziScarletFlameWheel:
  Name: 비염 사격
  Description: |-
    피해를 {Damage} 줍니다.
    이어서 무작위 적에게 같은 피해를 줍니다.

TianziWorldRevolve:
  Name: 천지 회전
  Description: |-
    손패가 홀수라면 카드를 {Value1}장 뽑습니다.
    손패가 짝수라면 버린 카드 더미에서 무작위 카드 {Value1}장을 손에 넣습니다.
  ExtraDescription1: |-
    손패가 홀수라면 카드를 {Value1}장 뽑습니다.
    |d:손패가 짝수라면 버린 카드 더미에서 무작위 카드 {Value1}장을 손에 넣습니다.|
  ExtraDescription2: |-
    |d:손패가 홀수라면 카드를 {Value1}장 뽑습니다.|
    손패가 짝수라면 버린 카드 더미에서 무작위 카드 {Value1}장을 손에 넣습니다.

TianziPeachNectar:
  Name: 복숭아의 감로
  Description: |-
    체력을 {Value1} 회복합니다.
    |절벽|을 {Value2} 얻습니다.

TianziPeachReserve:
  Name: 선도 비축
  Description: |-
    |턴 종료 시|: {SelfName}이(가) 손에 있다면 |절벽|을 2 얻습니다.
    |턴 시작 시|: {SelfName}이(가) 손에 있다면 지난 턴에 잃은 |절벽| {Value1}당 |방어|를 {Value2} 얻고 카드를 1장 뽑습니다. 1턴에 최대 2번 발동합니다.
  FlavorText: |-
    그녀는 선도를 잘게 쪼개 소매에 넣었다. "가는 길에 배고프면 간식으로 먹으려고"라면서.

TianziBlazingSword:
  Name: 기염만장의 검
  Description: |-
    |취약|을 {Value1}턴 부여합니다.
    피해를 {Damage} 줍니다.
    마나를 1 더 지불할 때마다 공격 횟수가 1 증가합니다.
    {PlayerName}에게 |날씨|가 없다면 |쾌청|을 1턴 얻습니다.

TianziGrowingBraver:
  Name: 비염 레이저
  Description: |-
    피해를 {Damage} 줍니다.
    방어되지 않은 피해를 줄 때 {Value1} |화력|을 얻습니다.

TianziMeteorPlunge:
  Name: 대기권 돌입
  Description: |-
    모든 적에게 피해를 {Damage} 줍니다.
    이어서 모든 적에게 {PlayerName}의 |절벽| 2배의 피해를 줍니다.

TianziQuakeWorld:
  Name: 건곤을 뒤흔드는 일격
  Description: |-
    피해를 {Damage} 줍니다.
    {Mana}를 얻습니다.
    이번 턴 {PlayerName}가 다른 공격 카드를 사용할 때마다 {SelfName}의 코스트가 임의 색 마나 1만큼 감소합니다.

TianziOverwhelming:
  Name: 초목을 꺾듯
  Description: |-
    피해를 {Damage} 줍니다.
    이 피해가 대상의 |방어|나 |보호막|을 뚫었다면 |취약|을 {Value1}턴 부여합니다.

TianziDanceSword:
  Name: 환무의 검
  Description: |-
    즉시 {Mana1}을 1 소모합니다.
    피해를 {Damage} 줍니다.
    |허약|을 {Value1}턴 부여합니다.
    다음 턴에 {Mana}를 얻고 카드를 1장 뽑습니다; 마나를 소모하지 못했다면 마나를 얻지 않습니다.

TianziLandLiquefy:
  Name: 대지 액화
  Description: |-
    모든 적에게 피해를 {Damage} 주고,
    |방어|와 |보호막|을 {Value1} 잃게 합니다.

TianziKeystoneStorm:
  Name: 천벌의 석주
  Description: |-
    모든 적에게 피해를 {Damage} 주고 |허약|을 1턴 부여합니다.
    |방어|를 {Value1} 얻습니다. 손패가 3장 이상이라면 |방어|를 {Value2} 추가로 얻습니다.

TianziScarletExecution:
  Name: 비색 광상
  Description: |-
    피해를 {Damage} 줍니다.
    손패가 홀수라면 이번 턴 다음 공격 카드가 2배의 피해를 줍니다.
    손패가 짝수라면 카드를 3장 뽑습니다.
  ExtraDescription1: |-
    피해를 {Damage} 줍니다.
    손패가 홀수라면 이번 턴 다음 공격 카드가 2배의 피해를 줍니다.
    |d:손패가 짝수라면 카드를 3장 뽑습니다.|
  ExtraDescription2: |-
    피해를 {Damage} 줍니다.
    |d:손패가 홀수라면 이번 턴 다음 공격 카드가 2배의 피해를 줍니다.|
    손패가 짝수라면 카드를 3장 뽑습니다.

TianziHeavenDescent:
  Name: 천궁 붕락
  Description: |-
    피해를 {Damage} 줍니다.
    |절벽|을 전부 소모하고, 소모한 값의 2배의 피해를 대상에게 줍니다.
    손패가 홀수라면 이 피해가 {Value1} 증가합니다.
    손패가 짝수라면 소모한 |절벽|과 같은 양의 |보호막|을 얻습니다.
  ExtraDescription1: |-
    피해를 {Damage} 줍니다.
    |절벽|을 전부 소모하고, 소모한 값의 2배의 피해를 대상에게 줍니다.
    손패가 홀수라면 이 피해가 {Value1} 증가합니다.
    |d:손패가 짝수라면 소모한 절벽과 같은 양의 보호막을 얻습니다.|
  ExtraDescription2: |-
    피해를 {Damage} 줍니다.
    |절벽|을 전부 소모하고, 소모한 값의 2배의 피해를 대상에게 줍니다.
    |d:손패가 홀수라면 이 피해가 {Value1} 증가합니다.|
    손패가 짝수라면 소모한 |절벽|과 같은 양의 |보호막|을 얻습니다.

TianziKeystoneArmor:
  Name: 요석 갑주
  Description: |-
    |방어|를 {Block} 얻고 |보호막|을 {Shield} 얻습니다.
    {SelfName}을 사용할 때마다 얻는 |보호막|이 {Value1} 증가합니다.

TianziClearSky:
  Name: 청공만리
  Description: |-
    손, 뽑을 카드 더미, 버린 카드 더미에서 최대 {Value1}장의 카드를 선택해 |소멸|시킵니다.
    |소멸|시킨 카드 1장당 |보호막|을 {Shield} 얻습니다.

TianziHeavenCanopy:
  Name: 유정천개
  Description: |-
    |방어|를 {Block} 얻습니다.
    카드를 {Value1}장 뽑습니다.

TianziHeavenlyFlight:
  Name: 천인의 활공
  Description: |-
    {Mana}를 얻습니다.
    카드를 {Value1}장 뽑습니다.

TianziHeavenlyInstinct:
  Name: 천인의 직감
  Description: |-
    손패가 홀수라면 {Mana}를 얻습니다.
    손패가 짝수라면 카드를 {Value1}장 뽑습니다.
  ExtraDescription1: |-
    손패가 홀수라면 {Mana}를 얻습니다.
    |d:손패가 짝수라면 카드를 {Value1}장 뽑습니다.|
  ExtraDescription2: |-
    |d:손패가 홀수라면 {Mana}를 얻습니다.|
    손패가 짝수라면 카드를 {Value1}장 뽑습니다.

TianziHeavenlyRitual:
  Name: 천인의 예법
  Description: |-
    |예지| {Scry}. 카드를 1장 뽑습니다.
    공격 카드를 뽑았다면 |화력|을 1 얻고; 방어 카드라면 |영력|을 1 얻으며;
    스킬 카드라면 카드를 {Value1}장 추가로 뽑고; 상태나 액운이라면 |소멸|시킵니다.

TianziHeavenlyWriting:
  Name: 천인 낙서
  Description: |-
    손패를 1장 선택해 |소멸|시키고 카드를 {Value1}장 뽑습니다.
    |소멸|시킨 카드에 따라: 공격이라면 무작위로 |취약|을 1턴 부여하고; 방어라면 무작위로 |허약|을 1턴 부여하며;
    스킬이라면 카드를 1장 추가로 뽑고; 능력이라면 |비호|를 {Value2} 얻으며; 액운이나 상태라면 |광휘|를 1장 손에 넣습니다.

TianziWeatherMastery:
  Name: 무구의 흙
  Description: |-
    손패를 1장 버립니다. |방어|를 {Block} 얻습니다.
    버린 카드 더미에서 최대 1장을 선택해 뽑을 카드 더미 맨 위에 놓습니다.
    손패 수가 {Value1}보다 많다면 {Mana}를 추가로 얻습니다.

TianziScarletRadiance:
  Name: 비상의 위광
  Description: |-
    카드가 |소멸|될 때마다 모든 적에게 {Value1}의 공격 피해를 줍니다.

TianziScarletWave:
  Name: 비상검 참파
  Description: |-
    매 턴 처음 {Value1}번 공격으로 피해를 줄 때, 같은 양의 |방어|를 얻습니다.
    이 능력은 중복되지 않습니다.

TianziOddEvenQi:
  Name: 천인의 기질
  Description: |-
    |홀짝|을 가진 카드를 사용할 때, 홀짝 효과는 {PlayerName}가 선택해 발동하도록 바뀝니다.

TianziPeachBoost:
  Name: 선도 증폭
  Description: |-
    |절벽|을 얻을 때 1 추가로 얻습니다.
    즉시 |절벽|을 {Value1} 얻습니다.
    이 능력은 중복되지 않습니다.

TianziPeachGarden:
  Name: 무한한 도원
  Description: |-
    |절벽|이 감소할 때 |절벽|을 1 얻습니다.

TianziPureWish:
  Name: 청림의 소원
  Description: |-
    매 턴 처음 {Value1}번 액운이나 상태 카드를 뽑았을 때, 그것을 |소멸|시키고 카드를 1장 뽑습니다; |비호|가 발동할 때도 이 효과가 발동합니다.
    이 능력은 중복되지 않습니다.

TianziHeavenShield:
  Name: 천계의 비호
  Description: |-
    {PlayerName}의 턴 시작 시 {Mana}를 얻습니다.
    {PlayerName}의 턴 종료 시 |비호|를 1 얻습니다.
    이 능력은 중복되지 않습니다.

TianziMeditation:
  Name: 일념
  Description: |-
    매 턴 카드를 1장 더 뽑습니다.
    턴 시작 시 손패 1장과 버린 카드 더미의 카드 1장을 교체할 수 있습니다.

TianziEndurance:
  Name: 천인의 인내
  Description: |-
    턴 시작 시 |방어|를 10 얻고,
    |영력|을 1 얻습니다(최대 3까지).

TianziPeachBlossom:
  Name: 인과 장악
  Description: |-
    |인과|를 가진 카드를 사용할 때, 인과 효과는 {PlayerName}가 선택해 발동하도록 바뀝니다.

TianziHeavenlyTempo:
  Name: 천인은 속되지 않는다
  Description: |-
    {PlayerName}의 턴 시작 시, 홀수 턴에는 |화력|을 {Value1} 얻고;
    짝수 턴에는 현재 |화력|의 {Value2}배의 |방어|를 얻습니다(최대 25).
  UpgradedDescription: |-
    {PlayerName}의 턴 시작 시, 홀수 턴에는 |화력|을 {Value1} 얻고;
    짝수 턴에는 현재 |화력|의 {Value2}배의 |방어|를 얻습니다(최대 25).
    여러 번 사용하면 화력 획득량이 중첩됩니다.

TianziFinalBlade:
  Name: 종절의 일검
  Description: |-
    피해를 {Damage} 줍니다.
    그 적이 체력을 6% 잃을 때마다 {SelfName}은 그 적의 최대 체력의 {Value1}%에 해당하는 피해를 추가로 줍니다.

TianziHardshipFirst:
  Name: 선우후락의 검
  Description: |-
    피해를 {Damage} 줍니다.
    손패가 홀수라면 사용 후 {SelfName}을 뽑을 카드 더미 맨 위에 놓습니다.
    손패가 짝수라면 이번 턴이 끝날 때까지 손패를 모두 보유합니다.
  ExtraDescription1: |-
    피해를 {Damage} 줍니다.
    손패가 홀수라면 사용 후 {SelfName}을 뽑을 카드 더미 맨 위에 놓습니다.
    |d:손패가 짝수라면 이번 턴이 끝날 때까지 손패를 모두 보유합니다.|
  ExtraDescription2: |-
    피해를 {Damage} 줍니다.
    |d:손패가 홀수라면 사용 후 {SelfName}을 뽑을 카드 더미 맨 위에 놓습니다.|
    손패가 짝수라면 이번 턴이 끝날 때까지 손패를 모두 보유합니다.
  FlavorText: |-
    천하의 근심을 먼저 근심하고, 천하의 즐거움을 나중에 즐긴다 - 그 이치는 그녀의 머릿속에 깊이 새겨져 있었다.

TianziUnthinkableBlade:
  Name: 비상「비상비비상의 검」
  Description: |-
    피해를 {Damage} 줍니다.
    다음 턴 |날씨|를 하나 무작위로 발동합니다. {Value1}턴 지속됩니다.
    {PlayerName}의 턴을 종료하고 추가 턴을 진행합니다.
    |시간 제한| {Mana}.
  FlavorText: |-
    그 일격에는 이름이 없다. 떠올리지 못할 때는 이름 따위 중요하지 않으니까.

TianziPureDawn:
  Name: 항정의 여명
  Description: |-
    피해를 {Damage} 줍니다.
    {PlayerName}의 부정적 효과를 전부 제거하고,
    준 피해의 절반에 해당하는 |자연치유|를 얻습니다.
  FlavorText: |-
    동트는 하늘은 잡념 하나 없이 맑았다. 누군가 하늘 전체를 씻어낸 것처럼.

TianziWorldCleaver:
  Name: 건곤일척
  Description: |-
    마나를 전부 소모합니다(X). 소모한 마나와 같은 수의 손패를 버립니다.
    카드를 1장 버릴 때마다 1회 발동: 공격이라면 |화력|을 1 얻고; 방어라면 |영력|을 1 얻으며;
    스킬이라면 {Mana}를 얻고; 능력・액운・상태라면 이 카드를 |소멸|시키고 버린 카드 더미에서 무작위 액운이나 상태를 1장 추가로 |소멸|시킵니다.
    버릴 수 있는 손패 수를 초과한 마나만큼 {Mana2}를 반환합니다. 그런 다음 같은 수의 카드를 뽑습니다.

TianziScarletApocalypse:
  Name: 기부「천계기상의 검」
  Description: |-
    피해를 {Damage} 줍니다.
    다음 턴 |날씨|를 하나 무작위로 발동합니다. {Value1}턴 지속됩니다.
    {SelfName}을 사용할 때 이미 |날씨|가 있다면 1.5배의 피해를 줍니다.

TianziFinalJudgement:
  Name: 극채복광
  Description: |-
    {PlayerName}가 자신의 턴에 {Mana}를 얻을 때, 모든 적에게 그 최대 체력의 1%의 피해를 줍니다.
    |활력|을 1장 손에 넣습니다.
  UpgradedDescription: |-
    {PlayerName}가 자신의 턴에 {Mana}를 얻을 때, 모든 적에게 그 최대 체력의 1%의 피해를 줍니다.
    |채홍|을 1장 손에 넣습니다.

TianziHeavenCreation:
  Name: 천계의 창조물
  Description: |-
    무작위 {PlayerName}의 레어 카드 {Value1}장 중 1장을 선택해 손에 넣습니다.
    코스트는 0이며 |소멸|과 |휘발성|을 가집니다.

TianziRainbowAura:
  Name: 홍채의 기식
  Description: |-
    {PlayerName}의 기본 마나 색마다 각각 2마나를 얻습니다.

TianziHeavenRoam:
  Name: 천계 만유
  Description: |-
    손패를 1장 선택해 |소멸|시키고 카드를 1장 뽑습니다.
    {PlayerName}가 카드를 {Value1}장 사용할 때마다 {SelfName}은 버린 카드 더미에서 손으로 돌아옵니다.
    |선보임|: |광휘|를 1장 손에 넣습니다.

TianziHeavenMirror:
  Name: 천계의 거울
  Description: |-
    이번 턴에 마지막으로 사용한 카드의 복사본 1장을 손에 넣습니다.
    코스트는 0이며 |소멸|을 가집니다.

TianziPeachTalisman:
  Name: 도부「철벽의 선도」
  Description: |-
    |천의무봉|을 1턴 얻고 |절벽|을 {Value1} 얻습니다.
    4자연턴마다 |천의무봉|을 1 얻습니다.
  FlavorText: |-
    도부는 문틀에 붙였다. 덴구의 부채로도 떼어낼 수 없다.

TianziMortalJourney:
  Name: 인간계의 유람
  Description: |-
    {PlayerName}가 카드를 {Value1}장 사용할 때마다 {Mana}를 얻고 카드를 1장 뽑습니다.
    이 능력은 중복되지 않습니다.
  FlavorText: |-
    인간계에 내려온 그녀는 인간의 리듬을 배웠다. 몇 걸음 걷고, 잠시 쉬고.

TianziHeavenThrone:
  Name: 유정천의 은총
  Description: |-
    턴 시작 시 |방어|를 잃을 때, 남은 |방어|를 |절벽|으로 전환합니다.
    매 턴 시작 시 {Mana}를 얻습니다.

TianziPeachEternity:
  Name: "야생 복숭아 밀크"
  Description: |-
    {PlayerName}의 |절벽| 상한이 {Value1} 증가합니다.
    {PlayerName}는 매 턴 시작 시 |절벽|을 {Value2} 얻습니다.
  FlavorText: |-
    포장에 이렇게 적혀 있다. 유통기한: 영원.

TianziParityOddChoice:
  Name: 홀수
  Description: |-
    홀수 효과를 발동합니다.

TianziParityEvenChoice:
  Name: 짝수
  Description: |-
    짝수 효과를 발동합니다.

TianziPlayChoice:
  Name: 사용
  Description: |-
    이 카드를 사용합니다.

TianziExileChoice:
  Name: 소멸
  Description: |-
    이 카드를 |소멸|시킵니다.

TianziKarmaAttackChoice:
  Name: 공격
  Description: |-
    공격 |인과|를 발동합니다.

TianziKarmaDefenseChoice:
  Name: 방어
  Description: |-
    방어 |인과|를 발동합니다.

TianziKarmaSkillChoice:
  Name: 스킬
  Description: |-
    스킬 |인과|를 발동합니다.

TianziKarmaAbilityChoice:
  Name: 능력
  Description: |-
    능력 |인과|를 발동합니다.

TianziKarmaCurseChoice:
  Name: 액운
  Description: |-
    액운이나 상태 |인과|를 발동합니다.

TianziIkuFriend:
  Name: 용궁의 사자 이쿠
  Description: |-
    {FriendP}|예지| {Scry}. 자신의 턴이 시작되기 전까지 |정전기|를 {Value2} 얻습니다.
  ExtraDescription1: |-
    {FriendA}|천의무봉|을 1턴 얻습니다.

TianziShrugIgnore:
  Name: 어깨 으쓱 무시
  Description: |-
    |방어|를 {Block} 얻습니다.
    이번 턴 {PlayerName}가 피해를 받을 때 |방어|를 1 얻습니다. 이 효과는 중복되지 않으며 턴 종료 시 사라집니다.

TianziBlueMeditation:
  Name: 명상
  Description: |-
    |물결|을 1장 손에 넣습니다.
    손패가 홀수라면 카드를 1장 뽑습니다.
    손패가 짝수라면 손패를 1장 선택해 |소멸|시킵니다.
  ExtraDescription1: |-
    |물결|을 1장 손에 넣습니다.
    손패가 홀수라면 카드를 1장 뽑습니다.
    |d:손패가 짝수라면 손패를 1장 선택해 소멸시킵니다.|
  ExtraDescription2: |-
    |물결|을 1장 손에 넣습니다.
    |d:손패가 홀수라면 카드를 1장 뽑습니다.|
    손패가 짝수라면 손패를 1장 선택해 |소멸|시킵니다.

TianziTemperamentProbe:
  Name: 기질 탐사
  Description: |-
    {PlayerName}는 턴 내에 |홀짝|을 가진 카드를 사용할 때마다 카드를 1장 뽑습니다.

TianziEarthStone:
  Name: 영상「대지를 지키는 돌」
  Description: |-
    손에 들어올 때 {SelfName}을 |소멸|시킵니다.
    |진석|을 {Value1} 얻습니다.

TianziFeast:
  Name: 경축연
  Description: |-
    적을 쓰러뜨릴 때마다 체력을 2 회복하고 {Mana}를 얻으며 카드를 1장 뽑습니다.

TianziPeachMake:
  Name: 선도 제조
  Description: |-
    |절벽|을 3 잃습니다. |절벽|이 없다면 발동하지 않습니다.
    체력을 2 회복하고 <sprite="Point" name="Power">를 2 얻으며 {Mana}를 얻고 카드를 {Value1}장 뽑습니다.

TianziDomainDuel:
  Name: 경계 대결
  Description: |-
    다음에 받는 적의 공격 피해를 완전히 막고, 그 피해를 그대로 되돌려줍니다.

TianziHeavenDoor:
  Name: 천계의 문
  Description: |-
    손패를 1장 선택해 |강화|하고 |절벽|을 {Value1} 얻습니다.
    |강화|한 카드에 따라:
    공격이라면 그 복사본을 손에 넣습니다. 코스트는 0이며 |소멸|과 |휘발성|을 가집니다;
    방어라면 |방어|를 {Value2} 얻습니다;
    스킬이라면 카드를 2장 뽑습니다.

TianziAyaNewsSp:
  Name: 붕붕마루 텐시 특간호
  Description: |-
    |턴 종료 시|: |영력|을 {Value1} 잃습니다.
  FlavorText: |-
    월도만상전 특집! {PlayerName}에 관한 소문을 상세히 실었습니다.

TianziKarmaShackle:
  Name: 인과의 족쇄
  Description: |-
    이 카드와 인접한 손패를 사용할 때, 반대쪽 인접 카드가 |사용 불가|를 얻습니다; 이렇게 부여된 |사용 불가|는 턴 종료 시 제거됩니다.
  PreventUsageMessage: |-
    인과의 족쇄가 인접 카드를 제한하고 있습니다.
  FlavorText: |-
    무에서 생겨난 족쇄도 결국 '인과'가 가져온 필연일 뿐이다. 태고의 가장 강한 사냥꾼도 언젠가 화석이 되듯, 그것은 이미 정해져 있었다...
