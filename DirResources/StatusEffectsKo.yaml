TianziTempHpSe:
  Name: 절벽
  Description: |-
    최대 체력과 별개인 전투 전용 추가 체력입니다. 상한은 15입니다.
    체력과 관련된 모든 효과와 연동됩니다.
    피해를 받을 때 |방어|와 |보호막| 보다 먼저 감소합니다.
  Brief: 노란색 추가 체력. 피격 시 방어보다 먼저 감소하며 상한은 15입니다.

TianziRegenSe:
  Name: 자연치유
  Description: |-
    {OwnerName}의 턴 종료 시 {Level}의 체력을 회복하고, 턴 시작 시 중첩이 1 감소합니다.
  Brief: 턴 종료 시 {Level}의 체력을 회복합니다.

TianziWeatherClear:
  Name: 쾌청
  Description: |-
    이 효과를 얻을 때 |그레이즈|를 1 얻고, {OwnerName}의 기본 마나 색 중 하나를 무작위로 1 얻습니다.
    {OwnerName}의 |그레이즈|는 턴 시작 시 사라지지 않습니다.
  Brief: 획득 시 |그레이즈|와 기본 색 마나를 얻습니다. |그레이즈|는 사라지지 않습니다.

TianziWeatherMist:
  Name: 안개비
  Description: |-
    {OwnerName}의 스펠 카드가 주는 피해가 1.25배가 됩니다.
  Brief: 스펠 카드의 피해가 증가합니다.

TianziWeatherCloud:
  Name: 흐린 하늘
  Description: |-
    이 효과가 있는 동안 카드를 1장 낼 때마다 무색 마나를 1 얻습니다.
  Brief: 카드를 낼 때마다 무색 마나를 얻습니다.

TianziWeatherAzure:
  Name: 푸른 하늘
  Description: |-
    턴 종료 시 {OwnerName}가 <sprite="Point" name="Power"> 를 7 얻습니다.
  Brief: 턴 종료 시 <sprite="Point" name="Power"> 를 얻습니다.

TianziWeatherHail:
  Name: 우박
  Description: |-
    {OwnerName}는 매 턴 종료 시 다음 턴에 기본 마나와 같은 양의 마나를 얻습니다.
  Brief: 다음 턴에 기본 마나와 같은 양의 마나를 얻습니다.

TianziWeatherFog:
  Name: 짙은 안개
  Description: |-
    {OwnerName}가 방어되지 않은 피해를 줄 때, 준 피해의 5%만큼 체력을 회복합니다.
  Brief: 방어되지 않은 피해의 일부를 체력으로 회복합니다.

TianziWeatherTyphoon:
  Name: 태풍
  Description: |-
    적은 |방어| 나 |보호막|을 얻을 수 없습니다.
    적이 이미 보유한 |방어|와 |보호막|을 즉시 모두 제거합니다.
  Brief: 적은 |방어|와 |보호막|을 얻을 수 없고, 기존 것도 제거됩니다.

TianziWeatherSun:
  Name: 맹렬한 태양
  Description: |-
    {OwnerName}의 턴 종료 시 모든 적이 최대 체력의 1%를 잃습니다.
  Brief: "{OwnerName}의 턴 종료 시 적이 최대 체력의 일부를 잃습니다."

TianziPeachBoostSe:
  Name: 선도 증폭
  Description: |-
    {OwnerName}가 |절벽|을 얻을 때 |절벽|을 1 더 얻습니다.
    이 능력은 중첩되지 않습니다.
  Brief: "|절벽| 획득 시 |절벽|이 추가됩니다. 중첩 불가."

TianziPeachGardenSe:
  Name: 무한한 도원
  Description: |-
    {OwnerName}의 |절벽|이 감소할 때 |절벽|을 1 얻습니다.
  Brief: "|절벽| 감소 시 |절벽|을 얻습니다."

TianziScarletRadianceSe:
  Name: 비상의 위광
  Description: |-
    카드가 소멸할 때마다 모든 적에게 {Level}의 공격 피해를 줍니다.
  Brief: 카드 소멸 시 모든 적에게 {Level}의 피해를 줍니다.

TianziScarletWaveSe:
  Name: 비상검 참파
  Description: |-
    {OwnerName}가 매 턴 처음 {Level}번(남은 {Count}번)의 공격으로 피해를 줄 때, 같은 양의 |방어|를 얻습니다.
    이 능력은 중첩되지 않습니다.
  Brief: 매 턴 처음 {Level}번(남은 {Count}번)의 공격 피해가 |방어| 로 전환됩니다. 중첩 불가.

TianziKeystoneMatrixSe:
  Name: 석진
  Description: |-
    앞으로 {Duration}턴 동안 {OwnerName}는 턴 시작 시 {Level}의 |방어|를 얻습니다.
  Brief: 턴 시작 시 {Level}의 |방어|를 얻습니다.

TianziNextTurnManaSe:
  Name: 축력
  Description: |-
    {OwnerName}는 다음 턴 시작 시 {Mana} 를 얻습니다.
  Brief: 다음 턴에 {Mana} 를 얻습니다.

TianziParityKwSe:
  Name: 홀짝
  Description: |-
    패의 장수가 홀수인지 짝수인지에 따라 다른 효과가 발동합니다.
  Brief: 패의 홀짝에 따라 효과가 달라집니다.

TianziKarmaKwSe:
  Name: 인과
  Description: "카드 종류(공격 / 방어 / 스킬 / 어빌리티 / 액운과 상태)에 따라 다른 효과가 발동합니다."
  Brief: 카드 종류에 따라 효과가 달라집니다.

TianziKarmaSe:
  Name: 인과 장악
  Description: |-
    |인과| 키워드를 가진 카드를 낼 때, 발동할 인과 효과를 직접 선택할 수 있습니다.
  Brief: 인과 효과를 선택할 수 있습니다.

TianziOddEvenSe:
  Name: 천인의 기질
  Description: |-
    패 장수의 「홀수 / 짝수」 분기 효과를 {OwnerName}가 선택하여 발동합니다.
  Brief: 홀짝 분기를 선택할 수 있습니다.

TianziWeatherForecastSe:
  Name: 관측
  Description: "다음 턴 시작 시 날씨를 하나 무작위로 발동합니다. {Duration}턴 지속됩니다."
  Brief: 다음 턴에 날씨를 발동합니다.

TianziMeditationSe:
  Name: 일념
  Description: |-
    {OwnerName}는 매 턴 카드를 1장 더 뽑습니다.
    턴 시작 시 패 1장과 버린 카드 더미 1장을 교체할 수 있습니다.
  Brief: 매 턴 추가 드로우. 패와 버린 더미를 교체할 수 있습니다.

TianziEnduranceSe:
  Name: 천인의 인내
  Description: |-
    {OwnerName}는 턴 시작 시 10의 |방어|를 얻고,
    |영력|을 1 얻습니다(최대 3까지 누적).
  Brief: 턴 시작 시 방어와 |영력|을 얻습니다.

TianziPureWishSe:
  Name: 청림의 소원
  Description: |-
    {OwnerName}가 매 턴 처음 {Level}번(남은 {Count}번) 액운이나 상태 카드를 뽑을 때,
    그것을 소멸시키고 카드를 1장 뽑습니다. |비호|가 발동할 때도 이 효과가 적용됩니다.
    이 능력은 중첩되지 않습니다.
  Brief: 매 턴 {Level}번(남은 {Count}번) 액운/상태를 소멸시키고 다시 뽑습니다. 중첩 불가.

TianziHeavenShieldSe:
  Name: 천계의 비호
  Description: |-
    {OwnerName}는 턴 시작 시 {Mana} 를 얻습니다.
    {OwnerName}는 턴 종료 시 |비호|를 1 얻습니다.
    이 능력은 중첩되지 않습니다.
  Brief: 턴 시작 시 {Mana} 를, 턴 종료 시 |비호|를 얻습니다. 중첩 불가.

TianziMortalJourneySe:
  Name: 인간계의 유람
  Description: |-
    {OwnerName}가 카드를 {Level}장 낼 때마다 {Mana} 를 얻고 카드를 1장 뽑습니다.
    {Count}장 더 내면 발동합니다.
    이 능력은 중첩되지 않습니다.
  Brief: "{Count}/{Level}장 남았습니다. 중첩 불가."

TianziPeachTalismanSe:
  Name: 도부「철벽의 선도」
  Description: |-
    4턴마다 {OwnerName}는 |천의무봉|을 1턴 얻고,
    즉시 {Level}의 |절벽|을 얻습니다.
  Brief: 몇 턴마다 |천의무봉|과 |절벽|을 얻습니다.

TianziHeavenlyTempoSe:
  Name: 천인은 속되지 않는다
  Description: |-
    홀수 턴 시작 시 {Count}의 |화력|을 얻습니다.
    짝수 턴 시작 시 현재 |화력| 의 {Level}배만큼의 |방어|를 얻습니다(최대 25).
  Brief: 홀수 턴은 |화력|, 짝수 턴은 |방어|를 최대 25까지 얻습니다.

TianziPeachEternitySe:
  Name: "야생 복숭아 밀크"
  Description: |-
    {OwnerName}의 |절벽| 상한이 {Level}만큼 오릅니다.
    매 턴 시작 시 {Count}의 |절벽|을 얻습니다.
  Brief: "|절벽| 상한이 오르고 매 턴 |절벽|을 얻습니다."

TianziScarletChargeSe:
  Name: 영능
  Description: |-
    이번 턴 다음 공격 카드의 타격당 피해가 {Level}만큼 증가합니다. 이 효과는 주인공의 일반 턴 종료 시 사라집니다.
  Brief: 다음 공격이 타격당 {Level}만큼 증가합니다. 턴 종료까지.

TianziPeachReserveSe:
  Name: 도저
  Description: |-
    {OwnerName}는 매 턴 종료 시 2의 |절벽|을 얻습니다.
    |절벽|이 누적 {Level}만큼 감소할 때마다 {Count}의 |방어|를 얻고 카드를 1장 뽑습니다.
    턴당 최대 2번 발동합니다.
  Brief: 턴 종료 시 |절벽|을 얻고, |절벽| 감소가 |방어| 로 환원됩니다.

TianziNextTurnPhilSe:
  Name: 환홍
  Description: "{OwnerName}는 다음 턴 시작 시 {Mana} 를 얻습니다."
  Brief: 다음 턴에 {Mana} 를 얻습니다.

TianziDoubleAttackSe:
  Name: 삼배도반
  Description: "이번 턴 다음 공격 카드가 원래의 2배 피해를 줍니다."
  Brief: 다음 공격이 원래의 몇 배 피해를 줍니다.

TianziShrugSe:
  Name: 어깨 으쓱 무시
  Description: |-
    {OwnerName}가 자신의 턴에 피해를 받을 때 {Level}의 |방어|를 얻습니다.
    {OwnerName}의 턴 종료 시 이 효과를 제거합니다.
  Brief: 이번 턴 피격 시 |방어|를 얻고, 턴 종료 시 사라집니다.

TianziHardshipRetainSe:
  Name: 후락
  Description: 이번 턴이 끝날 때까지 패를 모두 보존합니다.
  Brief: 턴 종료까지 패를 보존합니다.

TianziProbeSe:
  Name: 기질 탐사
  Description: "{OwnerName}가 |홀짝| 카드를 낼 때마다 카드를 1장 뽑습니다."
  Brief: 홀짝 카드를 내면 드로우합니다.

TianziEarthDelaySe:
  Name: 진석
  Description: "앞으로 {Count}턴의 시작 시 {Level}의 |자연치유|를 얻습니다."
  Brief: 앞으로의 턴에 |자연치유|를 얻습니다.

TianziFeastSe:
  Name: 경축연
  Description: "적을 1명 쓰러뜨릴 때마다 체력을 2 회복하고, {Mana} 를 얻고 카드를 1장 뽑습니다."
  Brief: 처치 시 회복, 마나 획득, 드로우.

TianziReflectSe:
  Name: 경계 대결
  Description: "다음 {Level}번의 적 공격으로 인한 체력 감소를 완전히 막고, 그대로 전액 되돌려줍니다."
  Brief: 다음 공격들을 막고 되돌려줍니다.

TianziGraceSe:
  Name: 유정천의 은총
  Description: |-
    턴 시작 시 |방어|를 잃을 때, 남은 |방어|를 |절벽| 으로 전환합니다.
    매 턴 시작 시 {Mana} 를 얻습니다.
  Brief: 턴 시작 시 |방어|를 |절벽| 으로 전환합니다.

TianziLethalSe:
  Name: 극채복광
  Description: "{OwnerName}가 턴 중에 {Mana} 를 얻을 때, 모든 적에게 최대 체력의 1%만큼 피해를 줍니다."
  Brief: "{Mana} 획득 시 적 최대 체력 비례 피해를 줍니다."

TianziBossPeachSe:
  Name: 선도
  Description: "피해를 받을 때 {Level}의 체력을 회복하고, 추가로 {Count}의 <sprite=\"Point\" name=\"Power\"> 를 축적합니다."
  Brief: 피격 시 체력 회복과 <sprite=\"Point\" name=\"Power\"> 축적.

TianziBossHeavenQiSe:
  Name: 천인의 기운
  Description: 턴 종료 시 부정적 효과가 1이 아닌 2중첩 감소합니다.
  Brief: 턴 종료 시 부정적 효과가 더 많이 감소합니다.

TianziBossKarmaInfluenceSe:
  Name: 인과 영향
  Description: |-
    주인공이 카드를 {Level}장 낼 때마다(진행도 {Count}/{Level}):
    이 카드가 왼쪽에서 홀수 번째면 무작위로 마나를 1 잃습니다. 짝수 번째면 무작위로 카드를 1장 버립니다.
  Brief: "{Level}장마다 홀짝 위치로 벌을 줍니다."
