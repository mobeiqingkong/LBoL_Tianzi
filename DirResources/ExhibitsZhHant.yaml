TianziExhibitA:
  Name: 仙桃
  Description: |-
    提供基礎法力{Mana}。將|比那名居天子|專屬卡牌加入卡池。
    每場戰鬥第一回合開始時多抽一張牌，並額外獲得{Mana2}。
    每回合結束時，獲得一點<sprite="Point" name="Power">。
    每當{PlayerName}受到影響生命值的傷害時，恢復 {Value1} 點生命值（每場戰鬥最多七次）。
    此效果觸發七次後，每回合結束時不再獲得<sprite="Point" name="Power">。
  FlavorText: |-
    有頂天桃園裡結出的第一顆果實，據說吃下去能續三千年壽命。天子把它揣在懷裡帶下了凡間，理由是「路上無聊，可以用來墊肚子」。
    「仙桃當然要留給重要的時候！……什麼算重要的時候？唔，心情好的時候就算吧。」

TianziBossKeepsake:
  Name: 天子的紀念品
  Description: |-
    擊敗第一章的天子後留下的信物。
    若攜帶此紀念品進入第二章，Boss 戰將必定遭遇比那名居天子。
  FlavorText: |-
    「把我的寶貝還給我！」

TianziExhibitB:
  Name: 緋想之劍
  Description: |-
    提供基礎法力{Mana}。將|比那名居天子|專屬卡牌加入卡池。
    每回合首次當{PlayerName}對敵人施加負面效果時，追加一回合|虛弱|；
    若該敵人已處於|虛弱|狀態，則改為追加一回合|易傷|。
  FlavorText: |-
    由緋想天的天候與天子的氣質一同鍛成的長劍。劍身無色，卻總能映出持劍者當下最真實的情緒——所以她心情不好的時候，誰都不想站在她對面。
    「這把劍不會說謊哦。它照出來的東西，就是我最真實的樣子——現在的話，大概是‘有點想揍你’吧。」
