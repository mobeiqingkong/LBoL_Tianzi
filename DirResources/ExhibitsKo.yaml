TianziExhibitA:
  Name: 선도
  Description: |-
    기본 마나 {Mana} 를 제공합니다. |히나나위 텐시| 전용 카드를 카드 풀에 추가합니다.
    각 전투의 첫 턴 시작 시 카드를 1장 더 뽑고 {Mana2} 를 추가로 얻습니다.
    매 턴 종료 시 <sprite="Point" name="Power"> 를 1 얻습니다.
    {PlayerName}가 체력에 영향을 주는 피해를 받을 때마다 {Value1} 의 체력을 회복합니다(전투당 최대 7회).
    이 효과가 7회 발동한 뒤에는 매 턴 종료 시 <sprite="Point" name="Power"> 를 얻지 않습니다.
  FlavorText: |-
    유정천 도원에서 처음 맺힌 열매. 먹으면 수명이 삼천 년 늘어난다고 한다. 텐시는 그것을 품에 넣고 인간계로 내려왔다. 이유는 "가는 길이 심심하니까, 요기용으로".
    "선도는 당연히 중요한 때를 위해 남겨두는 거야! ……중요한 때가 언제냐고? 음, 기분이 좋을 때 정도?"

TianziBossKeepsake:
  Name: 텐시의 기념품
  Description: |-
    1장의 텐시를 쓰러뜨린 뒤 남는 유품.
    이 기념품을 지니고 2장에 진입하면 보스전은 반드시 히나나위 텐시가 됩니다.
  FlavorText: |-
    "내 보물을 돌려줘!"

TianziExhibitB:
  Name: 비상의 검
  Description: |-
    기본 마나 {Mana} 를 제공합니다. |히나나위 텐시| 전용 카드를 카드 풀에 추가합니다.
    매 턴 처음 {PlayerName}가 적에게 부정적 효과를 부여할 때 |허약|을 1턴 추가합니다.
    그 적이 이미 |허약|이라면 대신 |취약|을 1턴 추가합니다.
  FlavorText: |-
    비상천의 날씨와 텐시의 기질로 벼려낸 장검. 칼날은 무색인데도 쥔 자의 가장 진실한 감정을 비춘다 - 그래서 그녀가 기분이 나쁠 때는 아무도 그녀 맞은편에 서려 하지 않는다.
    "이 검은 거짓말을 안 해. 비치는 건 내 가장 솔직한 모습 - 지금이라면 아마 '좀 때리고 싶다' 정도?"
