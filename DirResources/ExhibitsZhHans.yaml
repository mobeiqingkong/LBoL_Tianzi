TianziExhibitA:
  Name: 仙桃
  Description: |-
    提供基础法力{Mana}。将|比那名居天子|专属卡牌加入卡池。
    每场战斗第一回合开始时多抽 |e:1| 张牌，并额外获得{Mana2}。
    每回合结束时，获得 |e:1| 点<sprite="Point" name="Power">。
    每当{PlayerName}受到影响生命值的伤害时，恢复 {Value1} 点生命值（每场战斗最多 |e:7| 次）。
    此效果触发 |e:7| 次后，每回合结束时不再获得<sprite="Point" name="Power">。
  FlavorText: |-
    有顶天桃园里结出的第一颗果实，据说吃下去能续三千年寿命。天子把它揣在怀里带下了凡间，理由是「路上无聊，可以用来垫肚子」。
    「仙桃当然要留给重要的时候！……什么算重要的时候？唔，心情好的时候就算吧。」

TianziBossKeepsake:
  Name: 天子的纪念品
  Description: |-
    击败第一章的天子后留下的信物。
    若携带此纪念品进入第二章，Boss 战将必定遭遇比那名居天子。
  FlavorText: |-
    「把我的宝贝还给我！」

TianziExhibitB:
  Name: 绯想之剑
  Description: |-
    提供基础法力{Mana}。将|比那名居天子|专属卡牌加入卡池。
    每回合首次当{PlayerName}对敌人施加负面效果时，追加 |e:1| 回合|虚弱|；
    若该敌人已处于|虚弱|状态，则改为追加 |e:1| 回合|易伤|。
  FlavorText: |-
    由绯想天的天候与天子的气质一同锻成的长剑。剑身无色，却总能映出持剑者当下最真实的情绪——所以她心情不好的时候，谁都不想站在她对面。
    「这把剑不会说谎哦。它照出来的东西，就是我最真实的样子——现在的话，大概是‘有点想揍你’吧。」
