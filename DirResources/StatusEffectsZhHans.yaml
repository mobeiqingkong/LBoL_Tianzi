TianziTempHpSe:
  Name: 临命
  Description: |-
    独立于生命值上限的额外战斗内生命值，上限 15。
    可连携触发任何与生命值相关的效果。
    受到伤害时优先于|格挡|和|护盾|被扣减。
  Brief: 黄色额外生命，受击时优先于格挡扣减。

TianziRegenSe:
  Name: 自愈
  Description: |-
    {OwnerName}的回合结束时恢复 {Level} 点生命值，回合开始时层数 -1。
  Brief: 回合结束恢复 {Level} 点生命值。

TianziWeatherClear:
  Name: 快晴
  Description: |-
    随机一张卡牌的任意费用 -1。
    {OwnerName}的|闪避|不会在回合结束时消失。
  Brief: 随机一张牌费用 -1；|闪避|不会消失。

TianziWeatherMist:
  Name: 雾雨
  Description: |-
    {OwnerName}的符卡每段伤害提高至 1.25 倍。
  Brief: 符卡每段伤害 ×1.25。

TianziWeatherCloud:
  Name: 云天
  Description: |-
    所有卡牌的任意费用 -1。
  Brief: 所有卡牌费用 -1。

TianziWeatherAzure:
  Name: 苍天
  Description: |-
    {OwnerName}获得 7 p点。
  Brief: 获得 7 p点。

TianziWeatherHail:
  Name: 雹
  Description: |-
    {OwnerName}每回合结束时，下回合获得与基础法力等量的法力。
  Brief: 下回合获得等量基础法力。

TianziWeatherFog:
  Name: 浓雾
  Description: |-
    {OwnerName}造成的未被阻挡的伤害会恢复自身 5% 生命值。
  Brief: 未被阻挡的伤害回复 5% 生命值。

TianziWeatherTyphoon:
  Name: 台风
  Description: |-
    对手无法获得|格挡|或|护盾|。
  Brief: 对手无法获得|格挡|或|护盾|。

TianziWeatherCalm:
  Name: 无风
  Description: |-
    最后造成未被格挡伤害的一方获得 2 层|自愈|。
  Brief: 造成未被格挡伤害的一方获得|自愈|。

TianziPeachBoostSe:
  Name: 桃增
  Description: |-
    {OwnerName}获得|临命|时，额外获得 1 点|临命|。
  Brief: 获得|临命|时额外 +1。

TianziPeachGardenSe:
  Name: 桃园
  Description: |-
    {OwnerName}的|临命|减少时，获得 1 点|临命|。
  Brief: "|临命|减少时获得 1 点|临命|。"

TianziScarletRadianceSe:
  Name: 威光
  Description: |-
    每当一张牌被放逐，对所有敌人造成 {Level} 点攻击伤害。
  Brief: 放逐牌时对所有敌人造成 {Level} 点伤害。

TianziScarletWaveSe:
  Name: 斩波
  Description: |-
    {OwnerName}每回合首次造成攻击伤害时，获得等量的|格挡|。
  Brief: 每回合首次攻击伤害转为等量|格挡|。

TianziKeystoneMatrixSe:
  Name: 石阵
  Description: |-
    接下来 {Duration} 回合内，{OwnerName}每回合开始获得 {Level} 点|格挡|。
  Brief: 回合开始获得 {Level} 点|格挡|。

TianziNextTurnManaSe:
  Name: 蓄力
  Description: |-
    {OwnerName}下回合开始时获得 {Count} 点白色法力。
  Brief: 下回合获得 {Count} 点白色法力。

TianziParityKwSe:
  Name: 奇偶数
  Description: |-
    根据手牌张数的奇数 / 偶数触发不同效果。
    手中存在带有此关键字的牌时，没有该效果的手牌会变色。
  Brief: 按手牌张数的奇偶触发效果。

TianziKarmaKwSe:
  Name: 因果
  Description: 根据卡牌种类（攻击 / 防御 / 技能 / 能力 / 诅咒与状态）触发不同效果。
  Brief: 按卡牌种类触发效果。

TianziKarmaSe:
  Name: 因果选
  Description: 带有|因果|关键字的牌打出时，因果效果改为自行选择触发。
  Brief: 因果效果改为自行选择。

TianziOddEvenSe:
  Name: 奇偶
  Description: |-
    手牌张数的「奇数 / 偶数」分支效果改为由{OwnerName}选择触发。
  Brief: 奇偶分支改为自行选择。

TianziWeatherForecastSe:
  Name: 观测
  Description: 下回合开始时随机释放一种天气，持续 {Duration} 回合。
  Brief: 下回合释放天气。

TianziMeditationSe:
  Name: 一念
  Description: |-
    {OwnerName}每回合多抽 1 张牌；
    回合开始时，可将一张手牌与弃牌堆内的一张牌互换。
  Brief: 每回合多抽 1 张；可互换手牌与弃牌堆。
TianziEnduranceSe:
  Name: 耐性
  Description: |-
    {OwnerName}回合开始时保留上回合至多 10 点|格挡|，
    并获得 1 点|灵力|（最多累计 3 点）。
  Brief: 保留格挡并获得|灵力|。
TianziPureWishSe:
  Name: 清霖
  Description: |-
    {OwnerName}每回合前 {Level} 次抽到诅咒或状态牌时，
    将其放逐并抽 1 张牌。
  Brief: 前 {Level} 次抽到诅咒/状态牌时放逐并补抽。

TianziHeavenShieldSe:
  Name: 庇护
  Description: |-
    {OwnerName}每回合结束时获得 1 层|庇护|，并在下回合获得 1 点白色法力。
  Brief: 回合结束获得 1 层|庇护|。

TianziMortalJourneySe:
  Name: 凡游
  Description: |-
    {OwnerName}每打出 {Level} 张牌，获得 1 点白色法力并抽 1 张牌。
  Brief: 每 {Level} 张牌获得法力并抽牌。

TianziPeachTalismanSe:
  Name: 桃符
  Description: |-
    每 4 个回合，{OwnerName}获得 1 回合|天衣无缝|，
    并立即获得 {Level} 点|临命|。
  Brief: 每 4 回合获得|天衣无缝|与|临命|。

TianziHeavenlyTempoSe:
  Name: 天人
  Description: |-
    奇数回合开始时获得 1 点|火力|。
    偶数回合开始时获得等同于当前火力（升级后 1.5 倍）的|格挡|。
  Brief: 奇数火力，偶数格挡。
TianziPeachEternitySe:
  Name: 桃久
  Description: |-
    {OwnerName}的|临命|上限提高 {Level}；
    每回合开始获得 2 点|临命|。
  Brief: "|临命|上限 +{Level}，每回合 +2。"

TianziScarletChargeSe:
  Name: 绯充
  Description: |-
    本回合下一张攻击牌的每段伤害 +{Level}。
  Brief: 下一张攻击牌每段伤害 +{Level}。

TianziPeachReserveSe:
  Name: 桃储
  Description: |-
    {OwnerName}每回合结束时获得 2 点|临命|；
    每当累计减少 {Level} 点|临命|，获得 {Count} 点|格挡|并抽 1 张牌。
    每回合最多触发 2 次。
  Brief: 回合结束获得|临命|；|临命|减少时反哺|格挡|。

TianziNextTurnPhilSe:
  Name: 彩费
  Description: {OwnerName}下回合开始时获得 {Count} 点彩色法力。
  Brief: 下回合获得彩色法力。

TianziDoubleAttackSe:
  Name: 倍击
  Description: 本回合下一张攻击牌造成的伤害翻倍。
  Brief: 下一张攻击伤害翻倍。

TianziShrugSe:
  Name: 耸肩
  Description: {OwnerName}在自己的回合内受到伤害时，获得 {Level} 点|格挡|。
  Brief: 回合内受伤获得|格挡|。

TianziProbeSe:
  Name: 探查
  Description: {OwnerName}每打出一张|奇偶数|牌，抽 1 张牌。
  Brief: 打出奇偶牌时抽牌。

TianziEarthDelaySe:
  Name: 镇石
  Description: 持续 {Duration} 回合，每回合开始获得 {Level} 层|自愈|。
  Brief: 持续获得|自愈|。

TianziFeastSe:
  Name: 庆功
  Description: 每当一名敌人被打败，恢复 2 点生命值，获得 1 点彩色费用并抽 1 张牌。
  Brief: 击杀回血、得费、抽牌。

TianziReflectSe:
  Name: 对决
  Description: 完全抵挡下一次敌人攻击伤害并完整返还。
  Brief: 抵挡并返还下一次攻击。

TianziGraceSe:
  Name: 恩宠
  Description: |-
    回合结束时将失去的|格挡|转化为|临命|。
    每回合开始获得 1 点白色法力。
  Brief: 失去的|格挡|转为|临命|。

TianziLethalSe:
  Name: 致死
  Description: {OwnerName}在回合内获得无色或彩色法力时，对所有敌人造成其最大生命值 1% 的伤害。
  Brief: 获得无色法力时百分比伤害。
