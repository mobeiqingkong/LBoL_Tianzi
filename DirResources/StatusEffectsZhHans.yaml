TianziTempHpSe:
  Name: 临命
  Description: |-
    独立于生命值的战斗内生命池，上限与|桃久|的层数相关。
    受到伤害时优先于|格挡|和|护盾|被扣减，扣减不视为失去生命值。
  Brief: 独立生命池，受击时优先扣减。

TianziRegenSe:
  Name: 自愈
  Description: |-
    {OwnerName}的回合开始时恢复 {Level} 点生命值，回合结束时层数 -1。
  Brief: 回合开始恢复 {Level} 点生命值。

TianziWeatherClear:
  Name: 快晴
  Description: |-
    随机一张卡牌的任意费用 -1。
    {OwnerName}的|闪避|不会在回合结束时消失。
  Brief: 随机一张牌费用 -1；|闪避|不会消失。

TianziWeatherMist:
  Name: 雾雨
  Description: |-
    {OwnerName}的符卡每段伤害提高至 1.25 倍。
  Brief: 符卡每段伤害 ×1.25。

TianziWeatherCloud:
  Name: 云天
  Description: |-
    所有卡牌的任意费用 -1。
  Brief: 所有卡牌费用 -1。

TianziWeatherAzure:
  Name: 苍天
  Description: |-
    {OwnerName}的回合开始时获得 25 p点。
  Brief: 回合开始获得 25 p点。

TianziWeatherHail:
  Name: 雹
  Description: |-
    {OwnerName}每回合获得的基础法力数量翻倍。
  Brief: 基础法力获取翻倍。

TianziWeatherFog:
  Name: 浓雾
  Description: |-
    {OwnerName}造成的未被阻挡的伤害会恢复自身 5% 生命值。
  Brief: 未被阻挡的伤害回复 5% 生命值。

TianziWeatherTyphoon:
  Name: 台风
  Description: |-
    对手无法获得|格挡|或|护盾|。
  Brief: 对手无法获得|格挡|或|护盾|。

TianziWeatherCalm:
  Name: 无风
  Description: |-
    最后造成未被格挡伤害的一方获得 2 层|自愈|。
  Brief: 造成未被格挡伤害的一方获得|自愈|。

TianziPeachBoostSe:
  Name: 桃增
  Description: |-
    {OwnerName}获得|临命|时，额外获得 1 点|临命|。
  Brief: 获得|临命|时额外 +1。

TianziPeachGardenSe:
  Name: 桃园
  Description: |-
    {OwnerName}的|临命|减少时，获得 1 点|临命|。
  Brief: "|临命|减少时获得 1 点|临命|。"

TianziScarletRadianceSe:
  Name: 威光
  Description: |-
    每当一张牌被放逐，对所有敌人造成 {Level} 点攻击伤害。
  Brief: 放逐牌时对所有敌人造成 {Level} 点伤害。

TianziScarletWaveSe:
  Name: 斩波
  Description: |-
    {OwnerName}每回合首次造成攻击伤害时，获得等量的|格挡|。
  Brief: 每回合首次攻击伤害转为等量|格挡|。

TianziScarletDomainSe:
  Name: 绯域
  Description: |-
    每当一张牌被放逐，{OwnerName}获得 {Level} 点|格挡|。
  Brief: 放逐牌时获得 {Level} 点|格挡|。

TianziKeystoneMatrixSe:
  Name: 石阵
  Description: |-
    接下来 {Duration} 回合内，{OwnerName}每回合开始获得 {Level} 点|格挡|。
  Brief: 回合开始获得 {Level} 点|格挡|。

TianziKeystoneWardSe:
  Name: 镇守
  Description: |-
    {OwnerName}每回合开始获得 {Level} 点|格挡|；
    受到的攻击伤害减少 1 点。
  Brief: 回合开始获得 {Level} 点|格挡|；攻击伤害 -1。

TianziNextTurnManaSe:
  Name: 蓄力
  Description: |-
    {OwnerName}下回合开始时获得 {Count} 点白色法力。
  Brief: 下回合获得 {Count} 点白色法力。

TianziOddEvenSe:
  Name: 奇偶
  Description: |-
    手牌张数的「奇数 / 偶数」分支效果改为由{OwnerName}选择触发。
  Brief: 奇偶分支改为自行选择。

TianziMeditationSe:
  Name: 冥想
  Description: |-
    {OwnerName}每回合多抽 1 张牌；
    回合开始时，可将一张手牌与弃牌堆内的一张牌互换。
  Brief: 每回合多抽 1 张；可互换手牌与弃牌堆。

TianziEnduranceSe:
  Name: 耐性
  Description: |-
    {OwnerName}回合开始时只失去一半|格挡|；
    受到不高于 5 点的未被格挡攻击伤害时，将伤害降低为 1。
  Brief: 只失去一半|格挡|；小伤害降为 1。

TianziPureWishSe:
  Name: 清霖
  Description: |-
    {OwnerName}每回合前 {Level} 次抽到诅咒或状态牌时，
    将其放逐并抽 1 张牌。
  Brief: 前 {Level} 次抽到诅咒/状态牌时放逐并补抽。

TianziHeavenShieldSe:
  Name: 庇护
  Description: |-
    {OwnerName}每回合结束时获得 1 层|庇护|，并在下回合获得 1 点白色法力。
  Brief: 回合结束获得 1 层|庇护|。

TianziMortalJourneySe:
  Name: 凡游
  Description: |-
    {OwnerName}每打出 {Level} 张牌，获得 1 点白色法力并抽 1 张牌。
  Brief: 每 {Level} 张牌获得法力并抽牌。

TianziPeachTalismanSe:
  Name: 桃符
  Description: |-
    每 4 个回合，{OwnerName}获得 1 回合|天衣无缝|，
    并立即获得 {Level} 点|临命|。
  Brief: 每 4 回合获得|天衣无缝|与|临命|。

TianziPeachBlossomSe:
  Name: 桃华
  Description: |-
    {OwnerName}每回合结束时，若|临命|不少于 {Level}，
    抽 1 张牌并在下回合获得 1 点白色法力。
  Brief: "|临命|达标时抽牌并获得法力。"

TianziHeavenlyTempoSe:
  Name: 天人
  Description: |-
    {OwnerName}每回合开始时，手牌张数为奇数则获得 {Level} 点|火力|；
    为偶数则获得 {Level} ×2 点|格挡|。
  Brief: 奇数手牌得|火力|，偶数得|格挡|。

TianziPeachEternitySe:
  Name: 桃久
  Description: |-
    {OwnerName}的|临命|上限提高 {Level}；
    每回合开始获得 2 点|临命|。
  Brief: "|临命|上限 +{Level}，每回合 +2。"

TianziScarletChargeSe:
  Name: 绯充
  Description: |-
    本回合下一张攻击牌的每段伤害 +{Level}。
  Brief: 下一张攻击牌每段伤害 +{Level}。

TianziPeachReserveSe:
  Name: 桃储
  Description: |-
    {OwnerName}每回合结束时获得 2 点|临命|；
    每当累计减少 {Level} 点|临命|，获得 {Count} 点|格挡|并抽 1 张牌。
    每回合最多触发 2 次。
  Brief: 回合结束获得|临命|；|临命|减少时反哺|格挡|。

TianziHeavenRoamSe:
  Name: 漫游
  Description: |-
    {OwnerName}每打出 {Level} 张牌，指定的那张牌就会从弃牌堆回到手中。
  Brief: 每 {Level} 张牌取回指定的牌。

TianziKeystoneSingularitySe:
  Name: 奇点
  Description: |-
    {OwnerName}每回合结束时，若本回合未受到过伤害，
    获得 {Level} 点|格挡|，并在下回合获得 1 点白色法力。
  Brief: 未受伤则获得|格挡|与法力。

TianziHeavenThroneSe:
  Name: 玉座
  Description: |-
    {OwnerName}每回合开始获得 {Level} 点|格挡|。
  Brief: 回合开始获得 {Level} 点|格挡|。
