TianziTempHpSe:
  Name: Rampart
  Description: |-
    Extra in-battle life independent of maximum life, capped at 15.
    Counts toward any life-related effect.
    Absorbed before |Block| and |Barrier| when taking damage.
  Brief: Bonus yellow life. Absorbed before Block, up to 15.

TianziRegenSe:
  Name: Regeneration
  Description: |-
    At the end of {OwnerName}'s turn, gain {Level} life. Loses 1 stack at the start of the turn.
  Brief: Gain {Level} life at end of turn.

TianziWeatherClear:
  Name: Clear Sky
  Description: |-
    On gaining this effect, gain 1 |Graze| and 1 random mana of {OwnerName}'s base colors.
    {OwnerName}'s |Graze| does not expire at the start of the turn.
  Brief: On gain, 1 |Graze| and some base-color mana; |Graze| does not expire.

TianziWeatherMist:
  Name: Misty Rain
  Description: |-
    Increases the damage of {OwnerName}'s Spell Card to 1.25 times.
  Brief: Spell Card damage increased.

TianziWeatherCloud:
  Name: Cloudy Sky
  Description: |-
    While this effect is active, gain 1 colorless mana whenever a card is played.
  Brief: Gain some colorless mana per card played.

TianziWeatherAzure:
  Name: Azure Sky
  Description: |-
    At the end of the turn, {OwnerName} gains 7 <sprite="Point" name="Power">.
  Brief: At end of turn, gain some <sprite="Point" name="Power">.

TianziWeatherHail:
  Name: Hail
  Description: |-
    At the end of each of {OwnerName}'s turns, gain mana equal to their base mana on the next turn.
  Brief: Gain base mana again next turn.

TianziWeatherFog:
  Name: Dense Fog
  Description: |-
    When {OwnerName} deals unblocked damage, gain life equal to 5% of the damage dealt.
  Brief: Heal some % of unblocked damage dealt.

TianziWeatherTyphoon:
  Name: Typhoon
  Description: |-
    Enemies cannot gain |Block| or |Barrier|.
    Immediately clears all |Block| and |Barrier| enemies currently have.
  Brief: Enemies cannot gain |Block| or |Barrier|; existing ones are cleared.

TianziWeatherSun:
  Name: Blazing Sun
  Description: |-
    At the end of {OwnerName}'s turn, all enemies lose 1% of their maximum life.
  Brief: At end of {OwnerName}'s turn, enemies lose some % of maximum life.

TianziPeachBoostSe:
  Name: Peach Boost
  Description: |-
    When {OwnerName} gains |Rampart|, gain 1 additional |Rampart|.
    This ability does not stack.
  Brief: Gain extra |Rampart| when gaining |Rampart|. Does not stack.

TianziPeachGardenSe:
  Name: Endless Peach Garden
  Description: |-
    When {OwnerName}'s |Rampart| decreases, gain 1 |Rampart|.
  Brief: Gain some |Rampart| when |Rampart| decreases.

TianziScarletRadianceSe:
  Name: Hisou Radiance
  Description: |-
    Whenever a card is exiled, deal {Level} attack damage to all enemies.
  Brief: Deal {Level} damage to all enemies when a card is exiled.

TianziScarletWaveSe:
  Name: Hisou Sword Wave
  Description: |-
    The first {Level} times ({Count} left) {OwnerName}'s attacks deal damage each turn, gain |Block| equal to that damage.
    This ability does not stack.
  Brief: First {Level} attacks each turn ({Count} left) convert damage to |Block|. Does not stack.

TianziKeystoneMatrixSe:
  Name: Keystone Matrix
  Description: |-
    For the next {Duration} turns, {OwnerName} gains {Level} |Block| at the start of each turn.
  Brief: Gain {Level} |Block| at turn start.

TianziNextTurnManaSe:
  Name: Charge
  Description: |-
    {OwnerName} gains {Mana} at the start of next turn.
  Brief: Gain {Mana} next turn.

TianziParityKwSe:
  Name: Parity
  Description: |-
    Triggers different effects depending on whether the number of cards in hand is odd or even.
  Brief: Effects depend on hand parity.

TianziKarmaKwSe:
  Name: Karma
  Description: "Triggers different effects depending on card type (Attack / Defense / Skill / Ability / Misfortune and Status)."
  Brief: Effects depend on card type.

TianziKarmaSe:
  Name: Karma Mastery
  Description: |-
    When a card with the |Karma| keyword is played, you may choose which Karma effect triggers.
  Brief: Karma effects become selectable.

TianziOddEvenSe:
  Name: Celestial Disposition
  Description: |-
    The odd/even branch effect of the number of cards in hand is chosen by {OwnerName} instead.
  Brief: Odd/even branches become selectable.

TianziWeatherForecastSe:
  Name: Observation
  Description: "Releases a random weather at the start of next turn, lasting {Duration} turns."
  Brief: Releases a weather next turn.

TianziMeditationSe:
  Name: Single Thought
  Description: |-
    {OwnerName} draws 1 additional card each turn.
    At the start of the turn, may swap a card in hand with a card in the discard pile.
  Brief: Draw extra cards; may swap hand and discard pile.

TianziEnduranceSe:
  Name: Celestial Endurance
  Description: |-
    At the start of {OwnerName}'s turn, gain 10 |Block|, and gain 1 |Spirit| (up to 3).
  Brief: Gain some Block and |Spirit| at turn start.

TianziPureWishSe:
  Name: Pure Wish
  Description: |-
    The first {Level} times ({Count} left) {OwnerName} draws a Misfortune or Status card each turn, exile it and draw 1 card; this also triggers when |Ward| activates.
    This ability does not stack.
  Brief: Exile Misfortune/Status and redraw, {Level} times per turn ({Count} left). Does not stack.

TianziHeavenShieldSe:
  Name: Heavenly Ward
  Description: |-
    At the start of {OwnerName}'s turn, gain {Mana}.
    At the end of {OwnerName}'s turn, gain 1 |Ward|.
    This ability does not stack.
  Brief: Gain {Mana} at turn start and |Ward| at turn end. Does not stack.

TianziMortalJourneySe:
  Name: Mortal Journey
  Description: |-
    Every {Level} cards {OwnerName} plays, gain {Mana} and draw 1 card.
    {Count} more cards to go.
    This ability does not stack.
  Brief: Triggers in {Count}/{Level} cards. Does not stack.

TianziPeachTalismanSe:
  Name: Peach Charm "Impenetrable Peach"
  Description: |-
    Every 4 turns, {OwnerName} gains |Flawless| for 1 turn, and immediately gains {Level} |Rampart|.
  Brief: Gain |Flawless| and |Rampart| every few turns.

TianziHeavenlyTempoSe:
  Name: Unworldly Tempo
  Description: |-
    At the start of odd-numbered turns, gain {Count} |Firepower|.
    At the start of even-numbered turns, gain |Block| equal to {Level} times current |Firepower| (up to 25).
  Brief: Odd turns give |Firepower|, even turns give |Block| up to some.

TianziPeachEternitySe:
  Name: "Wild Peach Milk"
  Description: |-
    Increases {OwnerName}'s |Rampart| cap by {Level}.
    Gains {Count} |Rampart| at the start of each turn.
  Brief: "|Rampart| cap up; gain |Rampart| each turn."

TianziScarletChargeSe:
  Name: Charge Up
  Description: |-
    The next Attack card this turn deals {Level} more damage per hit. This effect is removed at the end of the player's normal turn.
  Brief: Next Attack deals {Level} more per hit until turn end.

TianziPeachReserveSe:
  Name: Peach Reserve
  Description: |-
    {OwnerName} gains 2 |Rampart| at the end of each turn.
    Whenever {Level} cumulative |Rampart| is lost, gain {Count} |Block| and draw 1 card.
    Triggers up to 2 times per turn.
  Brief: Gain |Rampart| at turn end; lost |Rampart| feeds |Block|.

TianziNextTurnPhilSe:
  Name: Rainbow
  Description: "{OwnerName} gains {Mana} at the start of next turn."
  Brief: Gain {Mana} next turn.

TianziDoubleAttackSe:
  Name: Triple Reflection
  Description: "The next Attack card this turn deals double damage."
  Brief: Next Attack deals some times the damage.

TianziShrugSe:
  Name: Shrug It Off
  Description: |-
    When {OwnerName} takes damage during their own turn, gain {Level} |Block|.
    Removes this effect at the end of {OwnerName}'s turn.
  Brief: Gain |Block| when damaged this turn; expires at turn end.

TianziHardshipRetainSe:
  Name: Deferred Joy
  Description: Retain all cards in hand until the end of this turn.
  Brief: Retain hand until turn end.

TianziProbeSe:
  Name: Temperament Probe
  Description: "{OwnerName} draws 1 card whenever a |Parity| card is played."
  Brief: Draw when a Parity card is played.

TianziEarthDelaySe:
  Name: Keystone
  Description: "At the start of the next {Count} turns, gain {Level} |Regeneration|."
  Brief: Gain |Regeneration| on upcoming turns.

TianziFeastSe:
  Name: Victory Feast
  Description: "Whenever an enemy is defeated, gain 2 life, gain {Mana}, and draw 1 card."
  Brief: On kill, heal, gain mana, and draw.

TianziReflectSe:
  Name: Boundary Duel
  Description: "Completely negates the life loss from the next {Level} enemy attacks, and returns the damage in full."
  Brief: Negate and return the next attacks.

TianziGraceSe:
  Name: Grace of Bhaavaagra
  Description: |-
    When losing |Block| at the start of the turn, convert the remaining |Block| into |Rampart|.
    Gain {Mana} at the start of each turn.
  Brief: Convert |Block| into |Rampart| at turn start.

TianziLethalSe:
  Name: Prismatic Radiance
  Description: "{OwnerName}, upon gaining {Mana} during their turn, deals damage equal to 1% of maximum life to all enemies."
  Brief: Gaining {Mana} damages all enemies for % of their maximum life.

TianziBossPeachSe:
  Name: Peach
  Description: "Gains {Level} life when taking damage, and accumulates {Count} additional <sprite=\"Point\" name=\"Power\">."
  Brief: Heals and accumulates <sprite=\"Point\" name=\"Power\"> when damaged.

TianziBossHeavenQiSe:
  Name: Celestial Qi
  Description: At the end of the turn, debuffs lose 2 stacks instead of 1.
  Brief: Debuffs lose extra stacks at turn end.

TianziBossKarmaInfluenceSe:
  Name: Karma Influence
  Description: |-
    Every {Level} cards the player plays (progress {Count}/{Level}):
    Odd position from the left: lose 1 random mana. Even position: discard 1 random card.
  Brief: Every {Level} cards, punish by odd/even position.
